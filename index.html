let BIN_SOL = null; // bin ID for solicitudes
let BIN_OC  = null; // bin ID for ordenes de compra

function getBinIds(){
  try{ const d=JSON.parse(localStorage.getItem(BIN_IDS_KEY)); return d||{}; }catch{ return {}; }
}
function saveBinIds(d){ localStorage.setItem(BIN_IDS_KEY, JSON.stringify(d)); }

async function createBin(name, data){
  const r = await fetch(JSONBIN_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY,'X-Bin-Name':name,'X-Bin-Private':'true'},
    body: JSON.stringify(data)
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error creando bin');
  return j.metadata.id;
}

async function fetchWithTimeout(url, opts={}, ms=10000){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {...opts, signal:ctrl.signal});
    clearTimeout(timer);
    return r;
  }catch(e){
    clearTimeout(timer);
    throw new Error('Sin conexión o tiempo agotado. Verifica tu internet.');
  }
}

async function readBin(id){
  const r = await fetchWithTimeout(`${JSONBIN_URL}/${id}/latest`,{
    headers:{'X-Master-Key':JSONBIN_KEY, 'X-Bin-Meta':'false'}
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error leyendo bin');
  return j.record || j;
}

async function updateBin(id, data){
  const r = await fetchWithTimeout(`${JSONBIN_URL}/${id}`,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
    body: JSON.stringify(data)
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error actualizando bin');
  return j.record;
}

async function initBins(){
  // Usar siempre los bins fijos — mismo dato en todos los dispositivos
  BIN_SOL = FIXED_BIN_SOL;
  BIN_OC  = FIXED_BIN_OC;
}

// ── In-memory cache to reduce API calls ──
let CACHE_SOL = null;
let CACHE_OC  = null;
let CACHE_SOL_TS = 0;
let CACHE_OC_TS  = 0;
const CACHE_TTL = 8000; // 8 seconds

async function getSolicitudes(){
  if(CACHE_SOL && Date.now()-CACHE_SOL_TS < CACHE_TTL) return [...CACHE_SOL];
  try{
    const d = await readBin(BIN_SOL);
    CACHE_SOL = d.solicitudes||d||[];
    CACHE_SOL_TS = Date.now();
  }catch(e){
    console.warn('getSolicitudes error:', e);
    if(!CACHE_SOL) CACHE_SOL = [];
  }
  return [...CACHE_SOL];
}
async function saveSolicitudes(arr){
  CACHE_SOL = arr;
  CACHE_SOL_TS = Date.now();
  await updateBin(BIN_SOL, {solicitudes:arr});
}
async function getOrdenes(){
  if(CACHE_OC && Date.now()-CACHE_OC_TS < CACHE_TTL) return {...CACHE_OC};
  try{
    const d = await readBin(BIN_OC);
    CACHE_OC = d.ordenes||{};
    CACHE_OC_TS = Date.now();
  }catch(e){
    console.warn('getOrdenes error:', e);
    if(!CACHE_OC) CACHE_OC = {};
  }
  return {...CACHE_OC};
}
async function saveOrdenes(obj){
  CACHE_OC = obj;
  CACHE_OC_TS = Date.now();
  await updateBin(BIN_OC, {ordenes:obj});
}

function h(tag, attrs='', ...children){
  return `<${tag} ${attrs}>${children.join('')}</${tag}>`;
}
function inp(id,val,ph='',type='text',extra=''){
  return `<input class="inp" id="${id}" type="${type}" value="${escH(val)}" placeholder="${escH(ph)}" ${extra}/>`;
}
function sel(id,val,opts,ph='-- Seleccionar --'){
  const options=[`<option value="">${ph}</option>`,...opts.map(o=>`<option value="${escH(o)}" ${val===o?'selected':''}>${escH(o)}</option>`)];
  return `<select class="sel" id="${id}">${options.join('')}</select>`;
}
function ta(id,val,ph=''){
  return `<textarea class="ta" id="${id}" rows="3" placeholder="${escH(ph)}">${escH(val)}</textarea>`;
}
function btn(label,cls,id='',style=''){
  return `<button class="btn ${cls}" id="${id}" style="${style}">${label}</button>`;
}
function field(label,req,content,hint=''){
  return `<div class="field"><label>${escH(label)}${req?'<span class="req">*</span>':''}</label>${content}${hint?`<p class="hint">${hint}</p>`:''}</div>`;
}
function badge(label,color){
  return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}</span>`;
}
function card(content,style=''){
  return `<div class="card" style="${style}">${content}</div>`;
}
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function empresaSel(id, val){
  const empresas = loadEmpresas();
  const opts = empresas.map(e=>`<option value="${escH(e.nombre)}" ${val===e.nombre?'selected':''}>${escH(e.nombre)}</option>`).join('');
  return `<select class="sel" id="${id}">
    <option value="">-- Seleccionar empresa --</option>
    ${opts}
  </select>`;
}

function sedesSel(id, val, empresaNombre){
  const empresas = loadEmpresas();
  const emp = empresas.find(e=>e.nombre===empresaNombre);
  const sedes = emp ? emp.sedes : [];
  if(!sedes.length) return `<input class="inp" id="${id}" value="${escH(val||'')}" placeholder="Sede"/>`;
  const opts = sedes.map(s=>`<option value="${escH(s)}" ${val===s?'selected':''}>${escH(s)}</option>`).join('');
  return `<select class="sel" id="${id}">
    <option value="">-- Seleccionar sede --</option>
    ${opts}
  </select>`;
}

function progressTracker(currentStep){
  const pct=Math.round((currentStep/STEPS.length)*100);
  return `
    <div class="progress-bar-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <span style="font-size:13px;font-weight:700;color:${pct===100?'var(--success)':'var(--accent)'};white-space:nowrap">
        ${pct===100?'✓ Completado':pct+'% completado'}
      </span>
    </div>
    <div class="progress-grid">
      ${STEPS.map(s=>{
        const done=s.id<currentStep,active=s.id===currentStep,pending=s.id>currentStep;
        return `<div class="progress-step ${done?'done':active?'active':'pending'}">
          <span style="font-size:15px">${s.icon}</span>
          <div>
            <p style="font-size:10px;font-weight:600;letter-spacing:.3px;color:${done?'var(--success)':active?'var(--accent)':'var(--muted)'}">
              ${done?'✓ Listo':active?'● En curso':'Pendiente'}
            </p>
            <p style="font-size:12px;font-weight:500">${s.label}</p>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function carpetaMover(solId, idx, dir){
  const carpeta=loadCarpetas(); if(!carpeta[solId]) return;
  const arr=carpeta[solId].archivos, ni=idx+dir;
  if(ni<0||ni>=arr.length) return;
  [arr[idx],arr[ni]]=[arr[ni],arr[idx]];
  carpeta[solId].archivos=arr; saveCarpetas(carpeta);
  // Re-render only the carpeta area
  const main=document.querySelector('.main-area');
  if(main){
    const sr=STATE.solicitudes.find(r=>r.id===solId);
    const tabs=main.querySelector('.detail-tabs');
    const container=document.getElementById('carpeta-container');
    if(container) container.outerHTML=carpetaFormHTML(sr);
    attachCarpetaEvents();
  }
}

function carpetaEliminar(solId, idx){
  const carpeta=loadCarpetas(); if(!carpeta[solId]) return;
  carpeta[solId].archivos.splice(idx,1); saveCarpetas(carpeta);
  const main=document.querySelector('.main-area');
  if(main){
    const sr=STATE.solicitudes.find(r=>r.id===solId);
    const container=document.getElementById('carpeta-container');
    if(container){ container.outerHTML=carpetaFormHTML(sr); attachCarpetaEvents(); }
  }
}

function attachCarpetaEvents(){
  document.getElementById('carpeta-upload')?.addEventListener('change', async(e)=>{
    const files=Array.from(e.target.files); if(!files.length) return;
    showLoading('Leyendo archivos...');
    const carpeta=loadCarpetas(), id=STATE.selectedId;
    if(!carpeta[id]) carpeta[id]={archivos:[]};
    for(const file of files){
      try{
        const ab=await file.arrayBuffer();
        const b64=btoa(String.fromCharCode(...new Uint8Array(ab)));
        carpeta[id].archivos.push({name:file.name, data:b64, size:(file.size/1024).toFixed(0)+'KB'});
      }catch(e){ console.warn('Error reading file:', file.name); }
    }
    saveCarpetas(carpeta); hideLoading();
    showToast('✓ '+files.length+' archivo(s) subido(s)','ok');
    const sr=STATE.solicitudes.find(r=>r.id===id);
    const container=document.getElementById('carpeta-container');
    if(container){ container.outerHTML=carpetaFormHTML(sr); attachCarpetaEvents(); }
    e.target.value='';
  });

  document.getElementById('carpeta-download')?.addEventListener('click', async()=>{
    const id=STATE.selectedId;
    const carpeta=loadCarpetas()[id];
    if(!carpeta?.archivos?.length){ showToast('No hay archivos en la carpeta','err'); return; }
    showLoading('Combinando PDFs...');
    try{
      if(typeof PDFLib==='undefined'){ showToast('Librería no cargada, espera un momento','err'); hideLoading(); return; }
      const{PDFDocument}=PDFLib;
      const merged=await PDFDocument.create();
      for(const archivo of carpeta.archivos){
        try{
          const bytes=Uint8Array.from(atob(archivo.data),c=>c.charCodeAt(0));
          const src=await PDFDocument.load(bytes,{ignoreEncryption:true});
          const pages=await merged.copyPages(src,src.getPageIndices());
          pages.forEach(p=>merged.addPage(p));
        }catch(e){ console.warn('Saltando archivo con error:', archivo.name); }
      }
      const pdfBytes=await merged.save();
      const blob=new Blob([pdfBytes],{type:'application/pdf'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`CarpetaCompra_${id}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.pdf`;
      a.click(); URL.revokeObjectURL(url);
      showToast('✓ Carpeta de compra descargada','ok');
    }catch(e){ showToast('Error: '+e.message,'err'); }
    hideLoading();
  });
}

// ══ ACCORDION SIDEBAR ════════════════════════════════════════════════════════
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function buildAccordionSidebar(filtered, selectedId, ordenes){
  if(!filtered || !filtered.length) return '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px;padding:14px">Sin solicitudes</p>';

  const grouped = {};
  filtered.forEach(r => {
    const empresa = (r.requester && r.requester.company) ? r.requester.company : 'Sin empresa';
    // Parse Colombian date format: "14/5/2026, 9:05:45 p. m." or "5/14/2026..."
    let fecha = new Date(r.createdAt);
    if(isNaN(fecha.getTime()) && r.createdAt){
      // Try parsing "DD/MM/YYYY" or "D/M/YYYY, HH:MM:SS a/p. m."
      const match = r.createdAt.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(match){
        // Colombian format: day/month/year
        fecha = new Date(parseInt(match[3]), parseInt(match[2])-1, parseInt(match[1]));
      }
    }
    const mesKey = isNaN(fecha.getTime()) ? 'Sin fecha' : MESES[fecha.getMonth()] + ' ' + fecha.getFullYear();
    if(!grouped[empresa]) grouped[empresa] = {};
    if(!grouped[empresa][mesKey]) grouped[empresa][mesKey] = [];
    grouped[empresa][mesKey].push(r);
  });

  if(!STATE._openEmpresas) STATE._openEmpresas = {};
  if(!STATE._openMeses)    STATE._openMeses    = {};

  let out = '';
  Object.entries(grouped).forEach(([empresa, meses]) => {
    const empOpen = STATE._openEmpresas[empresa] === true;
    const total   = Object.values(meses).reduce((s,a)=>s+a.length,0);
    const hasSel  = Object.values(meses).some(arr=>arr.some(r=>r.id===selectedId));
    const isOpen  = empOpen || hasSel;

    out += `<div style="border-bottom:1px solid var(--border)">
      <div onclick="toggleEmpresa('${escH(empresa)}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--surface);gap:8px;${isOpen?'border-left:3px solid var(--accent)':''}">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <span style="font-size:15px">🏢</span>
          <div style="min-width:0">
            <p style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(empresa)}</p>
            <p style="font-size:10px;color:var(--muted)">${total} solicitud${total!==1?'es':''}</p>
          </div>
        </div>
        <span style="color:var(--muted);font-size:14px;transform:rotate(${isOpen?90:0}deg);display:inline-block;transition:transform .2s">›</span>
      </div>`;

    if(isOpen){
      out += '<div>';
      Object.entries(meses).forEach(([mes, reqs]) => {
        const mk     = empresa + '__' + mes;
        const mOpen  = STATE._openMeses[mk] === true;
        const mSel   = reqs.some(r=>r.id===selectedId);
        const mIsOpen= mOpen || mSel;

        out += `<div>
          <div onclick="toggleMes('${escH(empresa)}','${escH(mes)}')" style="display:flex;align-items:center;justify-content:space-between;padding:7px 14px 7px 26px;cursor:pointer;background:var(--surface2);border-bottom:1px solid var(--border);gap:6px">
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-size:12px">📅</span>
              <span style="font-size:12px;font-weight:600;${mIsOpen?'color:var(--accent)':''}">${escH(mes)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:5px">
              <span style="background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:10px;padding:1px 6px;font-weight:600">${reqs.length}</span>
              <span style="color:var(--muted);font-size:12px;transform:rotate(${mIsOpen?90:0}deg);display:inline-block">›</span>
            </div>
          </div>`;

        if(mIsOpen){
          out += '<div style="padding:6px 8px;background:var(--bg)">';
          reqs.forEach(r => {
            const pct  = Math.round((r.currentStep/STEPS.length)*100);
            const done = r.currentStep >= STEPS.length;
            const hasOC= !!(ordenes && ordenes[r.id]);
            const act  = r.id === selectedId;
            out += `<div class="sol-card ${act?'active':''}" data-id="${r.id}">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
                <span class="sol-card-id" style="color:var(--accent)">${escH(r.id)}</span>
                <div style="display:flex;gap:3px">
                  ${r.cancelled?badge('🚫','var(--danger)'):(done?badge('✓','var(--success)'):badge(pct+'%','var(--warning)'))}
                  ${hasOC?badge('OC','var(--success)'):''}
                </div>
              </div>
              <p class="sol-card-name">${escH((r.requester&&r.requester.name)||'')}</p>
              <p class="sol-card-items">${(r.items||[]).map(i=>i.qty+'× '+escH(i.type)).join(', ')}</p>
              <div class="sol-card-bar-wrap"><div class="sol-card-bar" style="width:${pct}%;background:${done?'var(--success)':'var(--accent)'}"></div></div>
            </div>`;
          });
          out += '</div>';
        }
        out += '</div>';
      });
      out += '</div>';
    }
    out += '</div>';
  });
  return out;
}

function toggleEmpresa(empresa){
  if(!STATE._openEmpresas) STATE._openEmpresas = {};
  STATE._openEmpresas[empresa] = STATE._openEmpresas[empresa] === true ? false : true;
  refreshSidebar();
}

function toggleMes(empresa, mes){
  if(!STATE._openMeses) STATE._openMeses = {};
  const key = empresa + '__' + mes;
  STATE._openMeses[key] = STATE._openMeses[key] === true ? false : true;
  refreshSidebar();
}

function refreshSidebar(){
  const sidebar = document.querySelector('.sidebar');
  if(!sidebar) return;
  const filtered = [...STATE.solicitudes].reverse().filter(r=>{
    if(STATE.filter==='active'&&(r.currentStep>=STEPS.length||r.cancelled))return false;
    if(STATE.filter==='done'&&(r.currentStep<STEPS.length||r.cancelled))return false;
    if(STATE.filter==='cancelled'&&!r.cancelled)return false;
    if(STATE.srch&&!r.id.includes(STATE.srch.toUpperCase())&&!(r.requester?.name||'').toLowerCase().includes(STATE.srch.toLowerCase()))return false;
    return true;
  });
  sidebar.innerHTML = buildAccordionSidebar(filtered, STATE.selectedId, STATE.ordenes);
  attachSolCards();
}

function getDaysCounterHTML(rec){
  if(!rec) return '';
  try{
    const parseDate = s => {
      if(!s) return null;
      const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m) return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
      return new Date(s);
    };
    const now = new Date();
    const created = parseDate(rec.createdAt);
    const dias = created&&!isNaN(created) ? Math.floor((now-created)/(864e5)) : null;
    const lastH = rec.history&&rec.history.length ? rec.history[rec.history.length-1] : null;
    const lastDate = lastH ? parseDate(lastH.date) : null;
    const diasPaso = lastDate&&!isNaN(lastDate) ? Math.floor((now-lastDate)/(864e5)) : 0;
    const colDias = dias>15?'var(--danger)':dias>7?'var(--warning)':'var(--success)';
    const colPaso = diasPaso>7?'var(--danger)':diasPaso>3?'var(--warning)':'var(--text)';
    return '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">'
      +'<div style="padding:6px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;display:flex;align-items:center;gap:7px">'
      +'<span>📅</span><span style="color:var(--muted)">En proceso:</span>'
      +'<strong style="color:'+colDias+'">'+(dias!==null?dias+' día'+(dias!==1?'s':''):'—')+'</strong></div>'
      +'<div style="padding:6px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;display:flex;align-items:center;gap:7px">'
      +'<span>⏱️</span><span style="color:var(--muted)">En este paso:</span>'
      +'<strong style="color:'+colPaso+'">'+diasPaso+' día'+(diasPaso!==1?'s':'')+'</strong></div>'
      +'</div>';
  }catch(e){ return ''; }
}
function buildDashboard(solicitudes, ordenes){
  const total     = solicitudes.length;
  const enCurso   = solicitudes.filter(r=>!r.cancelled&&r.currentStep<STEPS.length).length;
  const completadas = solicitudes.filter(r=>!r.cancelled&&r.currentStep>=STEPS.length).length;
  const canceladas  = solicitudes.filter(r=>r.cancelled).length;
  const conOC       = Object.keys(ordenes).length;

  // By empresa
  const porEmpresa = {};
  solicitudes.forEach(r=>{
    const e = r.requester?.company||'Sin empresa';
    porEmpresa[e] = (porEmpresa[e]||0)+1;
  });
  const topEmpresas = Object.entries(porEmpresa).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // By step progress buckets
  const buckets = [0,0,0,0]; // 0-25%, 26-50%, 51-75%, 76-100%
  solicitudes.filter(r=>!r.cancelled).forEach(r=>{
    const pct = r.currentStep/STEPS.length;
    if(pct<=0.25) buckets[0]++;
    else if(pct<=0.50) buckets[1]++;
    else if(pct<=0.75) buckets[2]++;
    else buckets[3]++;
  });

  // By month (last 6 months)
  const porMes = {};
  solicitudes.forEach(r=>{
    const match = (r.createdAt||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(match){
      const key = MESES[parseInt(match[2])-1]+' '+match[3];
      porMes[key] = (porMes[key]||0)+1;
    }
  });
  const mesesData = Object.entries(porMes).slice(-6);
  const maxMes = Math.max(...mesesData.map(m=>m[1]),1);

  const hora = new Date().getHours();
  
  const saludoFinal = hora<12?'Buenos días ☀️':(hora<18?'Buenas tardes 🌤️':'Buenas noches 🌙');

  return `<div style="padding:4px 0 20px" class="fu">
    <!-- Greeting -->
    <div style="margin-bottom:24px">
      <h2 style="font-family:'Inter',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px">${saludoFinal}</h2>
      <p style="color:var(--muted);font-size:13px">Panel de Compras TIC · ${new Date().toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
    </div>

    <!-- KPI Cards -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px" class="dashboard-kpi">
      ${[
        {label:'Total solicitudes',val:total,icon:'📋',color:'var(--accent)'},
        {label:'En curso',val:enCurso,icon:'⏳',color:'var(--warning)'},
        {label:'Completadas',val:completadas,icon:'✅',color:'var(--success)'},
        {label:'Canceladas',val:canceladas,icon:'🚫',color:'var(--danger)'},
        {label:'Con Orden de Compra',val:conOC,icon:'📄',color:'#a78bfa'},
      ].map(k=>`
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden">
          <div style="position:absolute;top:-10px;right:-10px;font-size:48px;opacity:.08">${k.icon}</div>
          <p style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">${k.label}</p>
          <p style="font-size:32px;font-weight:800;font-family:'Inter',sans-serif;color:${k.color};line-height:1">${k.val}</p>
        </div>`).join('')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <!-- Donut chart: estados -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px">
        <p style="font-size:13px;font-weight:700;margin-bottom:16px;font-family:'Inter',sans-serif">Estado de Solicitudes</p>
        <div style="display:flex;align-items:center;gap:20px">
          <svg width="110" height="110" viewBox="0 0 110 110">
            ${(()=>{
              const data=[
                {v:enCurso,   c:'#f0a429'},
                {v:completadas,c:'#34c77b'},
                {v:canceladas, c:'#f05252'},
              ].filter(d=>d.v>0);
              const tot=data.reduce((s,d)=>s+d.v,0)||1;
              let angle=-Math.PI/2;
              const cx=55,cy=55,R=45,r=28;
              let paths='';
              data.forEach(d=>{
                const sweep=(d.v/tot)*Math.PI*2;
                const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
                const x2=cx+R*Math.cos(angle+sweep),y2=cy+R*Math.sin(angle+sweep);
                const xi1=cx+r*Math.cos(angle),yi1=cy+r*Math.sin(angle);
                const xi2=cx+r*Math.cos(angle+sweep),yi2=cy+r*Math.sin(angle+sweep);
                const large=sweep>Math.PI?1:0;
                paths+=`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${xi2.toFixed(1)},${yi2.toFixed(1)} A${r},${r} 0 ${large},0 ${xi1.toFixed(1)},${yi1.toFixed(1)} Z" fill="${d.c}" opacity=".9"/>`;
                angle+=sweep;
              });
              return paths+'<text x="55" y="52" text-anchor="middle" fill="#e2eaf4" font-size="18" font-weight="800" font-family="Syne">'+tot+'</text><text x="55" y="66" text-anchor="middle" fill="#6b7a94" font-size="9">total</text>';
            })()}
          </svg>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${[{l:'En curso',v:enCurso,c:'#f0a429'},{l:'Completadas',v:completadas,c:'#34c77b'},{l:'Canceladas',v:canceladas,c:'#f05252'}].map(d=>`

                <div style="width:10px;height:10px;border-radius:50%;background:${d.c};flex-shrink:0"></div>
                <span style="font-size:12px;color:var(--muted)">${d.l}</span>
                <span style="font-size:12px;font-weight:700;margin-left:auto;padding-left:8px">${d.v}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>

      <!-- Horizontal bars: progress buckets -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px">
        <p style="font-size:13px;font-weight:700;margin-bottom:16px;font-family:'Inter',sans-serif">Progreso del Proceso</p>
        ${[
          {l:'Inicio (0-25%)',  v:buckets[0], c:'#f05252'},
          {l:'Medio (26-50%)', v:buckets[1], c:'#f0a429'},
          {l:'Avanzado (51-75%)',v:buckets[2],c:'#3b9eff'},
          {l:'Final (76-100%)', v:buckets[3], c:'#34c77b'},
        ].map(b=>{
          const tot2=buckets.reduce((s,x)=>s+x,0)||1;
          const pct=Math.round((b.v/tot2)*100);
          return `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-size:11px;color:var(--muted)">${b.l}</span>
              <span style="font-size:11px;font-weight:700">${b.v}</span>
            </div>
            <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${b.c};border-radius:4px;transition:width .8s"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <!-- Bar chart: por mes -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px">
        <p style="font-size:13px;font-weight:700;margin-bottom:16px;font-family:'Inter',sans-serif">Solicitudes por Mes</p>
        ${mesesData.length===0?'<p style="color:var(--muted);font-size:12px;text-align:center;margin-top:20px">Sin datos</p>':
          `<div style="display:flex;align-items:flex-end;gap:8px;height:80px">
            ${mesesData.map(([mes,val])=>{
              const h=Math.round((val/maxMes)*70)+10;
              return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
                <span style="font-size:10px;font-weight:700;color:var(--accent)">${val}</span>
                <div style="width:100%;height:${h}px;background:linear-gradient(180deg,var(--accent),#1d6fbf);border-radius:4px 4px 0 0;min-height:8px"></div>
                <span style="font-size:9px;color:var(--muted);text-align:center;line-height:1.2">${mes.split(' ')[0].slice(0,3)}</span>
              </div>`;
            }).join('')}
          </div>`}
      </div>

      <!-- Top empresas -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px">
        <p style="font-size:13px;font-weight:700;margin-bottom:16px;font-family:'Inter',sans-serif">Top Empresas</p>
        ${topEmpresas.length===0?'<p style="color:var(--muted);font-size:12px">Sin datos</p>':
          topEmpresas.map(([emp,cnt],i)=>{
            const pct=Math.round((cnt/total)*100);

            return `<div style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;margin-bottom:3px">
                <span style="font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px">${escH(emp)}</span>
                <span style="font-size:11px;font-weight:700;color:${colors[i%colors.length]};flex-shrink:0;margin-left:4px">${cnt}</span>
              </div>
              <div style="height:6px;background:var(--surface2);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${colors[i%colors.length]};border-radius:3px"></div>
              </div>
            </div>`;
          }).join('')}
      </div>
    </div>
  </div>`;
}

                ${it.qty>1?(it.assignees||[]).map((a,j)=>`<p style="font-size:11px;color:var(--muted);margin-top:2px">U${j+1}: ${escH(a.name||'—')} · ${escH(a.cedula||'—')}</p>`).join(''):''}
              </div>`).join('')}
          </div>
        `,'grid-column:1/-1')}
      </div>

      ${card(`<h3 style="font-size:15px;margin-bottom:14px">Progreso del proceso</h3>${progressTracker(sel_rec.currentStep)}`,'margin-bottom:14px')}

      ${card(`
        <h3 style="font-size:15px;margin-bottom:14px">Historial de actividad</h3>
        <div style="max-height:300px;overflow-y:auto;padding-right:4px">
          ${[...(sel_rec.history||[])].reverse().map((h,i,arr)=>`
            <div class="history-item">
              <div style="display:flex;flex-direction:column;align-items:center;padding-top:3px">
                <div class="history-dot"></div>
                ${i<arr.length-1?'<div class="history-line"></div>':''}
              </div>
              <div style="padding-bottom:10px">
                <p style="font-weight:600;font-size:13px">${escH(h.label)}</p>
                <p style="font-size:11px;color:var(--muted);margin-bottom:${h.note?3:0}px">${escH(h.date)}</p>
                ${h.note?`<p style="font-size:11px;background:var(--surface2);padding:3px 9px;border-radius:6px;display:inline-block">📝 ${escH(h.note)}</p>`:''}
              </div>
            </div>`).join('')}
        </div>
      `)}
    </div>`;
  } else if(detailTab==='carpeta'){
    detailContent = carpetaFormHTML(sel_rec);
  } else if(detailTab==='requisicion'){
    const allReqs=loadREQs(),savedReq=allReqs[sel_rec.id],reqData=savedReq||emptyREQ();
    if(!savedReq){
      reqData.nombre=sel_rec.requester?.name||''; reqData.empresa=sel_rec.requester?.company||'';
      reqData.cargo=sel_rec.requester?.position||''; reqData.area=sel_rec.requester?.area||'';
      reqData.fechaSolicitud=new Date().toLocaleDateString('es-CO');
      reqData.elaboro=sel_rec.requester?.name||'';
    }
    detailContent=reqFormHTML(reqData,sel_rec);
  } else if(detailTab==='orden'){
    detailContent = ocForm(STATE.oc, sel_rec);
  }

  return `<div class="admin-wrap">
    <div class="admin-header">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px">⚙️</div>
          <span style="font-family:'Inter',sans-serif;font-weight:800;font-size:14px">Panel de Compras TIC</span>${STATE.currentUser?`<span style="font-size:11px;color:var(--muted);margin-left:8px">👤 ${escH(STATE.currentUser.nombre)}</span>`:''}
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${['all','active','done'].map((k,_,a)=>{
            const labels={all:'Todas',active:'En curso',done:'Completadas'};
            const counts={all:stats.total,active:stats.active,done:stats.done};
            return `<button class="btn btn-sm ${filter===k?'btn-primary':'btn-ghost'}" data-filter="${k}">${labels[k]} <strong>${counts[k]}</strong></button>`;
          }).join('')}
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        
        ${btn('↻','btn btn-ghost btn-sm','do-refresh')}
        <button data-theme-toggle onclick="toggleTheme()" title="Cambiar tema" style="padding:5px 10px;background:transparent;border:1px solid var(--border2);border-radius:var(--radius);color:var(--text3);cursor:pointer;font-size:13px;transition:all .15s">${getTheme()==='dark'?'☀️':'🌙'}</button>
        ${btn('Sincronizar nube','btn btn-ghost btn-sm','do-sync','font-size:11px')}
        <span id="notif-status" style="font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;animation:pulse 2s infinite"></span>Alertas activas</span>
        ${btn('⚙️ Parametrización','btn btn-ghost btn-sm','do-params','font-size:11px')}
        ${btn('Salir','btn btn-danger btn-sm','do-logout')}
      </div>
    </div>
    <div class="admin-body">
      <div class="sidebar" style="padding:0;display:flex;flex-direction:column">
        <!-- Filter pills like WhatsApp -->
        <div style="display:flex;gap:6px;padding:10px 10px 6px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);scrollbar-width:none">
          ${['all','active','done','cancelled'].map(k=>{
            const labels={all:'Todos',active:'En curso',done:'Completadas',cancelled:'Canceladas'};
            const counts={
              all:solicitudes.length,
              active:solicitudes.filter(r=>!r.cancelled&&r.currentStep<STEPS.length).length,
              done:solicitudes.filter(r=>!r.cancelled&&r.currentStep>=STEPS.length).length,
              cancelled:solicitudes.filter(r=>r.cancelled).length
            };
            const active=filter===k;
            return `<button data-filter="${k}" style="flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:${active?'var(--accent)':'var(--surface2)'};color:${active?'#fff':'var(--muted)'};transition:all .2s;white-space:nowrap">
              ${labels[k]} <span style="font-size:10px;opacity:.8">${counts[k]}</span>
            </button>`;
          }).join('')}
        </div>
        <!-- Search -->
        <div style="padding:8px 10px;flex-shrink:0;border-bottom:1px solid var(--border)">
          <input class="inp" id="admin-search" value="${escH(srch)}" placeholder="🔍 Buscar ID o nombre..." style="font-size:12px;padding:7px 12px"/>
        </div>
        <!-- Accordion list -->
        <div style="flex:1;overflow-y:auto">
          ${buildAccordionSidebar(filtered, selectedId, ordenes)}
        </div>
      </div>
      <div class="main-area">
        ${sel_rec?`
          <div class="detail-tabs">
            <button class="detail-tab ${detailTab==='gestion'?'active':''}" data-dtab="gestion">⚙️ Gestión</button>
            <button class="detail-tab ${detailTab==='orden'?'active':''}" data-dtab="orden">
              📄 Orden de Compra${ordenes[sel_rec.id]?'<span style="width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;margin-left:6px"></span>':''}
            </button>
          <button class="detail-tab ${detailTab==='requisicion'?'active':''}" data-dtab="requisicion">📋 Requisición${loadREQs()[sel_rec.id]?'<span style="width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;margin-left:6px"></span>':''}</button>
          <button class="detail-tab ${detailTab==='carpeta'?'active':''}" data-dtab="carpeta">📁 Carpeta de Compra</button>
          </div>`:''}
        ${detailContent}
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════════════════════════════════════
function readOCFromDOM(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const items=STATE.oc.items.map((_,i)=>({
    descripcion:g('oc_item_desc_'+i),
    cantidad:g('oc_item_qty_'+i),
    valorUnitario:g('oc_item_vu_'+i),
    iva:g('oc_item_iva_'+i)||19
  }));
  return {
    numeroOrden:g('oc_numeroOrden'),fecha:g('oc_fecha'),proveedor:g('oc_proveedor'),
    formaPago:g('oc_formaPago'),nit:g('oc_nit'),cotizacion:g('oc_cotizacion'),
    direccion:g('oc_direccion'),telefono:g('oc_telefono'),
    elaboradoPor:g('oc_elaboradoPor'),cargoElabora:g('oc_cargoElabora'),
    observaciones:g('oc_obs'),descuento:g('oc_descuento')||0,items
  };
}


function attachSolCards(){
  document.querySelectorAll('.sol-card[data-id]').forEach(el=>{
    el.addEventListener('click',async()=>{
      const id=el.dataset.id;
      const ords=await getOrdenes();
      const oc=ords[id]||emptyOC();
      STATE.selectedId=id; STATE.oc=oc; STATE.detailTab='gestion';
      const app=document.getElementById('app');
      app.innerHTML=STATE.adminAuth?renderAdmin():renderLogin();
      attachEvents();
    });
  });
}

function attachEvents(){
  // ── Public tabs ──
  document.getElementById('tab-form')?.addEventListener('click',()=>setState({publicTab:'form',formSent:null}));
  document.getElementById('tab-track')?.addEventListener('click',()=>setState({publicTab:'track'}));

  // ── Form ──
  document.getElementById('same-check')?.addEventListener('change',e=>setState({same:e.target.checked}));
  document.getElementById('motive')?.addEventListener('change',e=>setState({motive:e.target.value}));
  document.getElementById('other-motive')?.addEventListener('input',e=>setState({other:e.target.value}));
  document.getElementById('add-item')?.addEventListener('click',()=>{
    setState({items:[...STATE.items,emptyItem()]});
  });
  // Remove item
  document.querySelectorAll('[id^="rem-item-"]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.id.replace('rem-item-',''));
      setState({items:STATE.items.filter((_,j)=>j!==i)});
    });
  });
  // Item type/qty change
  STATE.items.forEach((_,i)=>{
    document.getElementById('item_otra_'+i)?.addEventListener('change',e=>{
      const items=[...STATE.items];
      items[i]={...items[i],paraOtraPersna:e.target.checked};
      setState({items});
    });
    // Receptor fields for this item
    ['name','position','cedula','phone','email','company','area','sede'].forEach(fld=>{
      document.getElementById('item_rec_'+fld+'_'+i)?.addEventListener('input',e=>{
        const items=[...STATE.items];
        items[i]={...items[i],receptor:{...items[i].receptor,[fld]:e.target.value}};
        STATE.items=items;
      });
    });
    document.getElementById('item_type_'+i)?.addEventListener('change',e=>{
      const items=[...STATE.items]; items[i]={...items[i],type:e.target.value}; setState({items});
    });
    document.getElementById('item_qty_'+i)?.addEventListener('change',e=>{
      const qty=Math.max(1,parseInt(e.target.value)||1);
      const items=[...STATE.items];
      const cur=items[i].assignees;
      items[i]={...items[i],qty,assignees:Array.from({length:qty},(_,j)=>cur[j]||{name:'',cedula:'',position:'',phone:'',email:'',company:'',area:''})};
      setState({items});
    });
    // Assignee fields — desde índice 1 (unidad 2 en adelante)
    STATE.items[i]?.assignees?.forEach((_,j)=>{
      if(j===0) return; // unidad 1 = solicitante, no se captura
      ['name','cedula','position','phone','email','company','area'].forEach(fld=>{
        document.getElementById(`asg_${i}_${j}_${fld}`)?.addEventListener('input',e=>{
          const items=[...STATE.items]; const a=[...items[i].assignees];
          a[j]={...a[j],[fld]:e.target.value};
          items[i]={...items[i],assignees:a}; STATE.items=items;
        });
      });
    });
  });

  // Person fields
  ['req_name','req_position','req_cedula','req_phone','req_email','req_company','req_area','req_sede'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',e=>{
      const k=id.replace('req_',''); STATE.req={...STATE.req,[k]:e.target.value};
    });
  });
  ['asg_name','asg_position','asg_cedula','asg_phone','asg_email','asg_company','asg_area','asg_sede'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',e=>{
      const k=id.replace('asg_',''); STATE.asg={...STATE.asg,[k]:e.target.value};
    });
  });

  // New sol button
  document.getElementById('new-sol')?.addEventListener('click',()=>{
    STATE.req=emptyPerson(); STATE.same=true; STATE.asg=emptyPerson();
    STATE.motive=''; STATE.other=''; STATE.descripcion=''; STATE.items=[emptyItem()]; STATE.formErrors=[];
    setState({formSent:null});
  });

  // Submit form
  document.getElementById('show-summary-btn')?.addEventListener('click',()=>{ openSummary(); });
  document.getElementById('submit-form')?.addEventListener('click',async()=>{
    const errs=[];
    const r=STATE.req;
    if(!r.name) errs.push('Nombre del solicitante es requerido');
    if(!r.position) errs.push('Cargo del solicitante es requerido');
    if(!r.cedula) errs.push('Cédula del solicitante es requerida');
    if(!r.phone) errs.push('Teléfono del solicitante es requerido');
    if(!r.email||!r.email.includes('@')) errs.push('Correo válido del solicitante es requerido');
    if(!STATE.motive) errs.push('Seleccione un motivo de compra');
    if(STATE.motive==='Otros'&&!STATE.other) errs.push('Especifique el motivo');
    STATE.items.forEach((it,i)=>{ if(!it.type) errs.push(`Equipo #${i+1}: seleccione el tipo`); });
    if(errs.length){ setState({formErrors:errs}); return; }

    showLoading('Enviando solicitud...');
    try{
      const id=genId();
      const rec={
        id, createdAt:nowStr(), currentStep:1,
        requester:STATE.req,
        assignee:STATE.same?{...STATE.req}:STATE.asg,
        sameAssignee:STATE.same,
        motive:STATE.motive==='Otros'?`Otros: ${STATE.other}`:STATE.motive,
        items:STATE.items,
        history:[{step:1,label:'Solicitud recibida',date:nowStr(),note:'Solicitud creada.'}]
      };
      const all=await getSolicitudes();
      all.push(rec);
      await saveSolicitudes(all);
      const sentEmail = STATE.req.email;
      // Reset all form state completely
      STATE.req = emptyPerson();
      STATE.same = true;
      STATE.asg = emptyPerson();
      STATE.motive = '';
      STATE.other = '';
      STATE.descripcion = '';
      STATE.items = [emptyItem()];
      STATE.formErrors = [];
      setState({formSent:{id,email:sentEmail}});
      // Enviar correo de confirmación
      showLoading('Enviando confirmación por correo...');
      try {
        const emailOk = await sendConfirmationEmail(rec);
        if(emailOk){
          showToast('✓ Solicitud enviada. Revisa tu correo: '+sentEmail,'ok');
        } else {
          showToast('✓ Solicitud guardada. El correo no pudo enviarse.','info');
        }
      } catch(emailErr) {
        console.error('Error email:', emailErr);
        showToast('✓ Solicitud guardada. Revisa tu correo manualmente.','info');
      }
    }catch(e){ showToast('Error al enviar: '+e.message,'err'); }
    hideLoading();
  });

  // Track
  document.getElementById('descripcion')?.addEventListener('input',e=>{ STATE.descripcion=e.target.value; });
  document.getElementById('track-q')?.addEventListener('input',e=>{ STATE.trackQ=e.target.value; });
  document.getElementById('track-q')?.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('do-track')?.click(); });
  document.getElementById('do-track')?.addEventListener('click',async()=>{
    showLoading('Buscando...');
    try{
      const all=await getSolicitudes();
      const r=all.find(x=>x.id===STATE.trackQ.trim().toUpperCase());
      if(r){ setState({trackRec:r,trackErr:''}); }
      else { setState({trackRec:null,trackErr:'No se encontró una solicitud con ese número.'}); }
    }catch(e){ setState({trackErr:'Error al buscar: '+e.message}); }
    hideLoading();
  });

  // Login
  document.getElementById('do-login')?.addEventListener('click',function(){
    const usuario = (document.getElementById('admin-user')||{}).value||'';
    const pw = (document.getElementById('admin-pw')||{}).value||'';
    // Check against usuarios list
    const usuarios = loadUsuarios();
    const user = usuarios.find(u=>u.activo&&u.usuario===usuario.trim()&&u.password===pw);
    // Fallback: old ADMIN_PASS for 'admin' user
    const isOldAdmin = (usuario===''||usuario==='admin') && pw===ADMIN_PASS;
    const authUser = user || (isOldAdmin?{id:'admin',nombre:'Administrador',usuario:'admin',rol:'admin',activo:true}:null);
    if(authUser){
      sessionStorage.setItem('tic_adm','1');
      sessionStorage.setItem('tic_user',JSON.stringify(authUser));
      STATE.adminAuth = true;
      STATE.currentUser = authUser;
      STATE.solicitudes = [];
      STATE.ordenes = {};
      STATE._openEmpresas = {};
      STATE._openMeses    = {};
      document.getElementById('app').innerHTML = renderAdmin();
      attachEvents();
      startNotifPolling();
      clearTitleBadge();
      // Load data after render
      getSolicitudes().then(sols=>{
        STATE.solicitudes=sols;
        getOrdenes().then(ords=>{
          STATE.ordenes=ords;
          document.getElementById('app').innerHTML = renderAdmin();
          attachEvents();
        }).catch(()=>{});
      }).catch(()=>{});
    } else {
      const err = document.getElementById('login-err');
      if(err) err.style.display='block';
    }
  });
  document.getElementById('admin-pw')?.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('do-login')?.click(); });

  // Admin search
  document.getElementById('admin-search')?.addEventListener('input',e=>setState({srch:e.target.value}));

  // Filter buttons
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.addEventListener('click',()=>setState({filter:el.dataset.filter}));
  });

  // Sol cards
  attachSolCards();

  // Detail tabs
  document.querySelectorAll('[data-dtab]').forEach(el=>{
    el.addEventListener('click',()=>{
      const tab=el.dataset.dtab;
      if(tab==='orden'){
        const oc=readOCFromDOM();
        STATE.oc=oc;
      }
      setState({detailTab:tab});
    });
  });

  // Advance
  document.getElementById('advance-note')?.addEventListener('input',e=>{ STATE.note=e.target.value; });

  // ── Retroceder un paso ──────────────────────────────────────────────────
  document.getElementById('do-retroceder')?.addEventListener('click',async()=>{
    const sel_rec=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    if(!sel_rec||sel_rec.currentStep<=1||sel_rec.cancelled) return;
    if(!confirm('¿Retroceder al paso anterior? El historial quedará registrado.')) return;
    showLoading('Retrocediendo...');
    try{
      const all=await getSolicitudes();
      const idx=all.findIndex(r=>r.id===STATE.selectedId);
      if(idx<0){hideLoading();return;}
      const prevStep=all[idx].currentStep-1;
      const step=STEPS.find(s=>s.id===prevStep);
      all[idx].currentStep=prevStep;
      all[idx].history=[...(all[idx].history||[]),{step:prevStep,label:'↩ Retrocedido a: '+step.label,date:nowStr(),note:STATE.note.trim()||'Paso retrocedido manualmente'}];
      await saveSolicitudes(all);
      STATE.solicitudes=all;STATE.note='';
      setState({solicitudes:all,note:''});
      showToast('↩ Retrocedido a: '+step.label,'info');
    }catch(e){showToast('Error: '+e.message,'err');}
    hideLoading();
  });

  // ── Reiniciar proceso ───────────────────────────────────────────────────
  document.getElementById('do-reiniciar')?.addEventListener('click',async()=>{
    const sel_rec=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    if(!sel_rec||sel_rec.cancelled) return;
    const motivo = prompt('⚠️ REINICIAR PROCESO\n\nEsto regresará la solicitud al Paso 1.\n\nIndique el motivo del reinicio (obligatorio):');
    if(!motivo||!motivo.trim()){showToast('Debe indicar el motivo del reinicio','err');return;}
    showLoading('Reiniciando proceso...');
    try{
      const all=await getSolicitudes();
      const idx=all.findIndex(r=>r.id===STATE.selectedId);
      if(idx<0){hideLoading();return;}
      all[idx].currentStep=1;
      all[idx].history=[...(all[idx].history||[]),{step:1,label:'🔄 Proceso reiniciado desde paso '+sel_rec.currentStep,date:nowStr(),note:'Motivo: '+motivo.trim()}];
      await saveSolicitudes(all);
      STATE.solicitudes=all;STATE.note='';
      setState({solicitudes:all,note:''});
      showToast('🔄 Proceso reiniciado al Paso 1','info');
    }catch(e){showToast('Error: '+e.message,'err');}
    hideLoading();
  });

  // ── Notificar al solicitante ────────────────────────────────────────────
  document.getElementById('do-notify-sol')?.addEventListener('click',async()=>{
    const sel_rec=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    if(!sel_rec){showToast('Selecciona una solicitud','err');return;}
    const stepLabel=STEPS.find(s=>s.id===sel_rec.currentStep)?.label||'En proceso';
    const msgExtra=STATE.note.trim()||'';
    const confirmed=confirm('Enviar correo a ' + (sel_rec.requester?.email||'') + '\n\nPaso actual: ' + stepLabel + (msgExtra?'\nNota: '+msgExtra:'') + '\n\n¿Confirmar envío?');
    if(!confirmed) return;
    showLoading('Enviando correo...');
    try{
      const pct=Math.round((sel_rec.currentStep/STEPS.length)*100);
      await emailjs.send('service_affdkj9','template_glx7cwj',{
        email_destino:sel_rec.requester?.email,
        email:sel_rec.requester?.email,
        name:sel_rec.requester?.name,
        nombre:sel_rec.requester?.name,
        sol_id:sel_rec.id,
        fecha:nowStr(),
        motivo:'Actualización de estado',
        equipos:(sel_rec.items||[]).map(i=>i.qty+'× '+i.type).join('\n'),
        mensaje:'Tu solicitud '+sel_rec.id+' está en el paso '+sel_rec.currentStep+'/'+STEPS.length+': '+stepLabel+(msgExtra?'\n\nNota del equipo de compras: '+msgExtra:''),
        descripcion:'Progreso: '+pct+'% completado',
        link:'https://yefersonhardwareitm.github.io/solicitudes-compra-tic/?buscar='+sel_rec.id
      });
      // Register in history
      const all=await getSolicitudes();
      const idx=all.findIndex(r=>r.id===STATE.selectedId);
      if(idx>=0){
        all[idx].history=[...(all[idx].history||[]),{step:sel_rec.currentStep,label:'✉️ Correo enviado al solicitante',date:nowStr(),note:'Paso notificado: '+stepLabel+(msgExtra?' — '+msgExtra:'')}];
        await saveSolicitudes(all);
        STATE.solicitudes=all;
        setState({solicitudes:all});
      }
      showToast('✓ Correo enviado a '+sel_rec.requester?.email,'ok');
    }catch(e){showToast('Error al enviar: '+e.message,'err');}
    hideLoading();
  });

  document.getElementById('do-advance')?.addEventListener('click',async()=>{
    const sel_rec=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    if(!sel_rec||sel_rec.currentStep>=STEPS.length) return;
    showLoading('Avanzando...');
    try{
      const all=await getSolicitudes();
      const idx=all.findIndex(r=>r.id===STATE.selectedId); if(idx<0){hideLoading();return;}
      const next=all[idx].currentStep+1;
      const step=STEPS.find(s=>s.id===next);
      all[idx].currentStep=next;
      all[idx].history=[...(all[idx].history||[]),{step:next,label:step.label,date:nowStr(),note:STATE.note.trim()||null}];
      await saveSolicitudes(all);
      STATE.solicitudes=all;
      STATE.note='';
      setState({solicitudes:all,note:''});

// EXCEL GENERATOR
// ══════════════════════════════════════════════════════════════════════════════
function generateExcel(oc, solicitud){
  if(typeof XLSX==='undefined'){ showToast('Librería Excel no cargada, intente de nuevo','err'); return; }
  const wb=XLSX.utils.book_new();
  const ws={};
  const sc=(addr,v)=>{ ws[addr]={v,t:typeof v==='number'?'n':'s'}; };

  sc('H1','GESTION TIC'); sc('AI1','CÓDIGO'); sc('AM1','GTI-FO-023');
  sc('AI2','FECHA'); sc('AM2',new Date().toLocaleDateString('es-CO'));
  sc('H3','ORDEN DE COMPRAS Y SERVICIOS (TIC)');
  sc('AI3','VERSIÓN'); sc('AM3',2);
  sc('AI4','PAGINA'); sc('AM4','1 DE 1');

  sc('B6','Numero de orden'); sc('L6',oc.numeroOrden);
  sc('Z6','Fecha');           sc('AH6',oc.fecha);
  sc('B7','Nombre del Proveedor'); sc('L7',oc.proveedor);
  sc('Z7','Forma de pago');   sc('AH7',oc.formaPago);
  sc('B8','NIT/ C.C');        sc('L8',oc.nit);
  sc('Z8','Nº Cotización');   sc('AH8',oc.cotizacion);
  sc('B9','Dirección');       sc('L9',oc.direccion);
  sc('Z9','Teléfono');        sc('AH9',oc.telefono);

  sc('A11','Item'); sc('D11','Descripción'); sc('Q11','Cantidad');
  sc('T11','Valor Unitario'); sc('Y11','Vr. Total Sin IVA');
  sc('AD11','% IVA'); sc('AG11','Vr. Total IVA'); sc('AL11','Total');

  oc.items.forEach((it,i)=>{
    const row=12+i;
    const q=parseFloat(it.cantidad)||0,vu=parseFloat(it.valorUnitario)||0,iv=(parseFloat(it.iva)||19)/100;
    const sinIva=q*vu,totIva=sinIva*iv,tot=sinIva+totIva;
    ws['A'+row]={v:i+1,t:'n'};
    ws['D'+row]={v:it.descripcion||'',t:'s'};
    ws['Q'+row]={v:q,t:'n'};
    ws['T'+row]={v:vu,t:'n',z:'#,##0'};
    ws['Y'+row]={v:sinIva,t:'n',z:'#,##0'};
    ws['AD'+row]={v:iv,t:'n',z:'0%'};
    ws['AG'+row]={v:totIva,t:'n',z:'#,##0'};
    ws['AL'+row]={v:tot,t:'n',z:'#,##0'};
  });

  const sub=oc.items.reduce((s,it)=>(parseFloat(it.cantidad)||0)*(parseFloat(it.valorUnitario)||0)+s,0);
  const tIva=oc.items.reduce((s,it)=>{const q=parseFloat(it.cantidad)||0,vv=parseFloat(it.valorUnitario)||0,iv=(parseFloat(it.iva)||19)/100;return s+q*vv*iv;},0);
  const desc=parseFloat(oc.descuento)||0, total=sub+tIva-desc;

  sc('AG60','Subtotal'); ws['AL60']={v:sub,t:'n',z:'#,##0'};
  sc('AG61','IVA');      ws['AL61']={v:tIva,t:'n',z:'#,##0'};
  sc('AG62','Descuento');ws['AL62']={v:desc,t:'n',z:'#,##0'};
  sc('AG63','Total');    ws['AL63']={v:total,t:'n',z:'#,##0'};
  sc('A60','Observaciones'); sc('A61',oc.observaciones||'');
  sc('C69','Elaboró: '+(oc.elaboradoPor||'')); sc('C70','Cargo: '+(oc.cargoElabora||''));
  sc('P69','Revisó: Carlos Andrés Peña Molina'); sc('P70','Cargo: Director TIC');
  sc('AD69','VoBo:'); sc('AD70','Cargo: Gerente');

  ws['!ref']='A1:AP74';
  ws['!cols']=Array.from({length:42},(_,i)=>({wch:i<3?8:i<15?12:8}));

  XLSX.utils.book_append_sheet(wb,ws,'GTI-FO-023');
  const fname=`OC_${oc.numeroOrden||solicitud?.id||'orden'}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.xlsx`;
  XLSX.writeFile(wb,fname);
  showToast('✓ Excel descargado: '+fname,'ok');
}

async function sendConfirmationEmail(rec) {

    const templateParams = {
      email_destino: rec.requester.email,

      nombre:        rec.requester.name,
      sol_id:        rec.id,
      fecha:         rec.createdAt,
      motivo:        rec.motive,
      equipos:       equipos,
      link:          'https://yefersonhardwareitm.github.io/solicitudes-compra-tic/?buscar='+rec.id,
      descripcion:   rec.descripcion||'',
      mensaje:       'Número de solicitud: '+rec.id
    };
    console.log('Enviando email a:', rec.requester.email);
    const response = await emailjs.send('service_affdkj9', 'template_glx7cwj', templateParams);
    console.log('Email enviado OK:', response.status, response.text);

function buildSummaryHTML(){
  const r  = STATE.req;
  const a  = STATE.asg;
  const items = STATE.items;
  const motive = STATE.motive==='Otros'?`Otros: ${STATE.other}`:STATE.motive;

  function row(label, val){
    if(!val) return '';
    return `<div class="sum-row"><span class="sum-label">${label}</span><span class="sum-val">${escH(val)}</span></div>`;
  }

  const solicitanteSection = `
    <div class="sum-section">
      <p class="sum-section-title">👤 Datos del Solicitante</p>
      ${row('Nombre', r.name)}
      ${row('Cargo', r.position)}
      ${row('Cédula', r.cedula)}
      ${row('Teléfono', r.phone)}
      ${row('Correo', r.email)}
      ${row('Empresa', r.company)}
      ${row('Área', r.area)}
    </div>`;

  const assigneeSection = STATE.same ? `
    <div class="sum-section">
      <p class="sum-section-title">📦 Asignación del Equipo</p>
      <div class="sum-row"><span class="sum-label">Receptor</span>
        <span class="sum-val" style="color:var(--success)">✓ Mismo solicitante</span></div>
    </div>` : `
    <div class="sum-section">
      <p class="sum-section-title">📦 Receptor del Equipo</p>
      ${row('Nombre', a.name)}
      ${row('Cargo', a.position)}
      ${row('Cédula', a.cedula)}
      ${row('Teléfono', a.phone)}
      ${row('Correo', a.email)}
      ${row('Empresa', a.company)}
      ${row('Área', a.area)}
    </div>`;

  const motiveSection = `
    <div class="sum-section">
      <p class="sum-section-title">🎯 Motivo de Compra</p>
      <div class="sum-row"><span class="sum-label">Motivo</span><span class="sum-val">${escH(motive)}</span></div>
      ${STATE.descripcion?`<div class="sum-row"><span class="sum-label">Descripción</span><span class="sum-val">${escH(STATE.descripcion)}</span></div>`:''}
    </div>`;

  const equipSection = `
    <div class="sum-section">
      <p class="sum-section-title">💻 Equipos Solicitados</p>
      ${items.map((it,i)=>`
        <div class="sum-equip-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${it.qty>1?6:0}px">
            <span style="font-weight:600;font-size:14px">${escH(it.type)}</span>
            <span style="background:var(--accent);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px">${it.qty}×</span>
          </div>
          ${it.qty>1?it.assignees.slice(1).map((a,j)=>`
            <p style="font-size:12px;color:var(--muted);margin:2px 0">Unidad ${j+2}: ${escH(a.name||'—')} · ${escH(a.cedula||'—')}</p>
          `).join(''):''}
        </div>`).join('')}
    </div>`;

  return solicitanteSection + assigneeSection + motiveSection + equipSection;
}

function openSummary(){
  // Validate first
  const errs=[];
  const r=STATE.req;
  if(!r.name)    errs.push('Nombre del solicitante es requerido');
  if(!r.position)errs.push('Cargo del solicitante es requerido');
  if(!r.cedula)  errs.push('Cédula del solicitante es requerida');
  if(!r.phone)   errs.push('Teléfono del solicitante es requerido');
  if(!r.email||!r.email.includes('@')) errs.push('Correo válido del solicitante es requerido');
  if(!r.company) errs.push('Nombre de la empresa es requerido');
  if(!r.area)    errs.push('Área a la que pertenece es requerida');
  if(!STATE.motive) errs.push('Seleccione un motivo de compra');
  if(STATE.motive==='Otros'&&!STATE.other) errs.push('Especifique el motivo');
  STATE.items.forEach((it,i)=>{ if(!it.type) errs.push(`Equipo #${i+1}: seleccione el tipo`); });

  if(errs.length){ setState({formErrors:errs}); return; }
  setState({formErrors:[]});

  // Build summary
  document.getElementById('summary-content').innerHTML = buildSummaryHTML();
  const modal = document.getElementById('summary-modal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

}

  showLoading('Guardando solicitud...');
  try{
    const id = genId();

      id, createdAt:nowStr(), currentStep:1,
      requester:STATE.req,
      assignee:STATE.same?{...STATE.req}:STATE.asg,
      sameAssignee:STATE.same,
      motive:STATE.motive==='Otros'?`Otros: ${STATE.other}`:STATE.motive,

      items:STATE.items,
      history:[{step:1,label:'Solicitud recibida',date:nowStr(),note:'Solicitud creada.'}]
    };
    const all = await getSolicitudes();
    all.push(rec);
    await saveSolicitudes(all);

    STATE.req=emptyPerson(); STATE.same=true; STATE.asg=emptyPerson();
    STATE.motive=''; STATE.other=''; STATE.descripcion=''; STATE.items=[emptyItem()]; STATE.formErrors=[];

async function confirmCancel(){
  const reason=document.getElementById('cancel-reason').value.trim();
  if(!reason){ showToast('Por favor indica el motivo de cancelación','err'); return; }
  showLoading('Cancelando solicitud...');
  try{
    const all=await getSolicitudes();
    const idx=all.findIndex(r=>r.id===_cancelId);
    if(idx<0){ hideLoading(); showToast('Solicitud no encontrada','err'); return; }
    all[idx].cancelled=true;
    all[idx].cancelReason=reason;
    all[idx].cancelledAt=nowStr();
    all[idx].history=[...(all[idx].history||[]),
      {step:all[idx].currentStep,label:'🚫 Solicitud cancelada',date:nowStr(),note:'Motivo: '+reason}];

    CACHE_SOL=all; CACHE_SOL_TS=Date.now();
    closeCancel();
    // Refresh track view
    STATE.trackRec=all[idx];
    setState({trackRec:all[idx]});
    showToast('✓ Solicitud cancelada correctamente','ok');
  }catch(e){ showToast('Error: '+e.message,'err'); }
  hideLoading();
}


function generateReqPDF(req,solicitud){
  if(typeof window.jspdf==='undefined'&&typeof jsPDF==='undefined'){showToast('Librería PDF no cargada','err');return;}
  const{jsPDF}=window.jspdf||window;
  const doc=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});
  const PW=595.28,ML=40,MT=34,CW=PW-80;
  const RED=[192,0,0],WHT=[255,255,255],BLK=[0,0,0],GRY=[242,242,242];
  function fr(x,y,w,h,f){doc.setFillColor(...f);doc.setDrawColor(...BLK);doc.setLineWidth(0.6);doc.rect(x,y,w,h,'FD');}
  function er(x,y,w,h){doc.setFillColor(...WHT);doc.setDrawColor(...BLK);doc.setLineWidth(0.6);doc.rect(x,y,w,h,'FD');}
  function ce(x,y,w,h,s,sz,bold,col,al){
    doc.setFontSize(sz||8);doc.setFont('helvetica',bold?'bold':'normal');doc.setTextColor(...(col||BLK));
    const ty=y+h/2+(sz||8)*0.35;
    if(al==='center')doc.text(String(s||''),x+w/2,ty,{align:'center'});
    else if(al==='right')doc.text(String(s||''),x+w-4,ty,{align:'right'});
    else doc.text(String(s||''),x+4,ty);
  }
  let Y=MT;
  // HEADER
  const HH=79,lw=91,iw=136,cw2=CW-lw-iw;
  doc.setDrawColor(...BLK);doc.setLineWidth(1.0);doc.rect(ML,Y,CW,HH);
  // Dynamic logo based on empresa
  const _solicEmp=(solicitud&&solicitud.requester&&solicitud.requester.company)||'';
  const _empRec=loadEmpresas().find(function(e){return e.nombre===_solicEmp;});
  const _useLogo=(_empRec&&_empRec.logo)?_empRec.logo:LOGO_B64;
  try{doc.addImage(_useLogo,'JPEG',ML+2,HY+2,lw-6,HH-4,undefined,'FAST');}catch(e){
    try{doc.addImage(LOGO_B64,'JPEG',ML+2,HY+2,lw-6,HH-4,undefined,'FAST');}catch(e2){}
  }
  doc.setLineWidth(0.6);doc.line(ML+lw,Y,ML+lw,Y+HH);
  const th=HH*0.40;
  doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(...BLK);
  doc.text('GESTIÓN DE COMPRAS',ML+lw+cw2/2,Y+th/2+5,{align:'center'});
  doc.line(ML+lw,Y+th,ML+lw+cw2,Y+th);
  doc.setFontSize(9);doc.text('REQUISICIÓN DE COMPRAS Y SERVICIOS TIC',ML+lw+cw2/2,Y+th+(HH-th)/2+4,{align:'center'});
  const ix=ML+lw+cw2;doc.line(ix,Y,ix,Y+HH);
  const rh=HH/4;
  [['CÓDIGO','GC-FO-001'],['FECHA','14/11/2023'],['VERSIÓN','3'],['PAGINA','1 DE 1']].forEach(([lb,vl],i)=>{
    const ry=Y+i*rh;if(i>0)doc.line(ix,ry,ix+iw,ry);
    const mid=ix+iw*0.48;doc.line(mid,ry,mid,ry+rh);
    ce(ix,ry,mid-ix,rh,lb,7,true);ce(mid,ry,ix+iw-mid,rh,vl,7);
  });
  Y+=HH+5;const FH=18;
  // INFO SOLICITANTE
  fr(ML,Y,CW,FH,RED);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...WHT);
  doc.text('INFORMACIÓN DEL SOLICITANTE',ML+CW/2,Y+FH/2+3,{align:'center'});Y+=FH;
  const hw=CW/2,l1=hw*0.30,v1=hw-l1;
  [['NOMBRE',req.nombre||'','EMPRESA',req.empresa||''],['CARGO',req.cargo||'','ÁREA',req.area||'']].forEach(([a,b,c,d])=>{
    let x=ML;fr(x,Y,l1,FH,RED);ce(x,Y,l1,FH,a,7.5,true,WHT);x+=l1;
    er(x,Y,v1,FH);ce(x,Y,v1,FH,b,7.5);x+=v1;
    fr(x,Y,l1,FH,RED);ce(x,Y,l1,FH,c,7.5,true,WHT);x+=l1;
    er(x,Y,v1,FH);ce(x,Y,v1,FH,d,7.5);Y+=FH;
  });
  // FECHA | URGENTE
  const fl=CW*0.20,fv=CW*0.30,fu=CW*0.22,snw=(CW-fl-fv-fu)/2;
  let x=ML;
  fr(x,Y,fl,FH,RED);ce(x,Y,fl,FH,'FECHA DE SOLICITUD',7,true,WHT);x+=fl;
  er(x,Y,fv,FH);ce(x,Y,fv,FH,req.fechaSolicitud||'',7.5);x+=fv;
  fr(x,Y,fu,FH,RED);ce(x,Y,fu,FH,'COMPRA URGENTE',7,true,WHT,'center');x+=fu;
  er(x,Y,snw,FH);doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(...BLK);doc.text('SI',x+4,Y+FH/2+3);
  er(x+snw,Y,snw,FH);doc.text('NO',x+snw+4,Y+FH/2+3);
  const cy=Y+FH/2;doc.setDrawColor(...BLK);doc.setLineWidth(0.6);
  if(req.urgente){doc.setFillColor(...RED);doc.circle(x+snw-8,cy,4,'FD');doc.setFillColor(...WHT);doc.circle(x+snw+snw-8,cy,4,'FD');}
  else{doc.setFillColor(...WHT);doc.circle(x+snw-8,cy,4,'FD');doc.setFillColor(...RED);doc.circle(x+snw+snw-8,cy,4,'FD');}
  Y+=FH;
  // TIPO REQUERIMIENTO
  fr(ML,Y,CW,FH,RED);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...WHT);

function attachParamsUsuariosEvents(){
  const usuarios = loadUsuarios();

  document.getElementById('params-new-user')?.addEventListener('click',()=>{
    const newId = genUsrId();
    const all = loadUsuarios();
    all.push({id:newId,nombre:'',usuario:'',password:'',rol:'compras',activo:true});
    saveUsuarios(all);
    window._editingUsuario = newId;
    reloadUsersList();
  });

  usuarios.forEach(u=>{
    document.getElementById('edit-usr-'+u.id)?.addEventListener('click',()=>{
      window._editingUsuario = u.id;
      reloadUsersList();
    });

    document.getElementById('toggle-usr-'+u.id)?.addEventListener('click',()=>{
      const all=loadUsuarios(), idx=all.findIndex(x=>x.id===u.id);
      if(idx>=0){ all[idx].activo=!all[idx].activo; saveUsuarios(all); reloadUsersList();
        showToast(all[idx].activo?'✓ Usuario activado':'Usuario desactivado','ok');}
    });

    document.getElementById('del-usr-'+u.id)?.addEventListener('click',()=>{
      if(!confirm('¿Eliminar usuario "'+u.nombre+'"?')) return;
      saveUsuarios(loadUsuarios().filter(x=>x.id!==u.id));
      reloadUsersList(); showToast('Usuario eliminado','ok');
    });

    document.getElementById('cancel-usr-'+u.id)?.addEventListener('click',()=>{
      const all=loadUsuarios(), e=all.find(x=>x.id===u.id);
      if(e&&!e.nombre) saveUsuarios(all.filter(x=>x.id!==u.id));
      window._editingUsuario=null; reloadUsersList();
    });

    document.getElementById('save-usr-'+u.id)?.addEventListener('click',()=>{
      const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
      const nombre=g('eu_nombre_'+u.id), usuario=g('eu_usuario_'+u.id);
      const pass=g('eu_pass_'+u.id), rol=g('eu_rol_'+u.id);
      if(!nombre||!usuario){showToast('Nombre y usuario son obligatorios','err');return;}
      const all=loadUsuarios();
      // Check duplicate username
      const dup=all.find(x=>x.usuario===usuario&&x.id!==u.id);
      if(dup){showToast('Ese nombre de usuario ya existe','err');return;}
      const idx=all.findIndex(x=>x.id===u.id);
      if(idx>=0){
        all[idx].nombre=nombre; all[idx].usuario=usuario; all[idx].rol=rol;
        if(pass) all[idx].password=pass;
        if(!all[idx].activo&&all[idx].activo!==false) all[idx].activo=true;
      }
      saveUsuarios(all);
      window._editingUsuario=null;
      reloadUsersList();
      showToast('✓ Usuario guardado','ok');
    });
  });
}

function reloadUsersList(){
  const list=document.getElementById('users-list');
  if(!list) return;
  const usuarios=loadUsuarios();
  list.innerHTML=usuarios.map(u=>window._editingUsuario===u.id?renderUserEdit(u):renderUserCard(u)).join('');
  attachParamsUsuariosEvents();
}

// Logo preview
function previewLogo(empId, input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    window._logoTemp = window._logoTemp||{};
    window._logoTemp[empId] = e.target.result;
    const el = document.getElementById('ep_logo_img_'+empId);
    if(el){
      el.outerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:contain" id="ep_logo_img_${empId}"/>`;
    }
  };
  reader.readAsDataURL(file);
}

// Add sede input dynamically
function addSede(empId){
  const container = document.getElementById('ep_sedes_'+empId);
  if(!container) return;
  const idx = container.children.length;
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:8px;align-items:center';
  div.innerHTML = `<input class="inp" id="ep_sede_${empId}_${idx}" placeholder="Nombre de la sede" style="flex:1"/>
    <button onclick="this.parentElement.remove()" style="padding:7px 10px;background:var(--danger)22;border:1px solid var(--danger)44;border-radius:6px;color:var(--danger);cursor:pointer;font-size:13px;flex-shrink:0">✕</button>`;
  container.appendChild(div);
}

function delSede(empId, idx){
  const el = document.getElementById(`ep_sede_${empId}_${idx}`);
  if(el) el.parentElement.remove();

  if(sedesContainer){
    sedesContainer.querySelectorAll('input').forEach(inp=>{
      const v=inp.value.trim(); if(v) sedes.push(v);
    });
  }
  const logo = (window._logoTemp&&window._logoTemp[empId]) || 
               loadEmpresas().find(e=>e.id===empId)?.logo || '';
  return {
    nombre, nit:g(`ep_nit_${empId}`), telefono:g(`ep_tel_${empId}`),
    direccion:g(`ep_dir_${empId}`), logo, sedes:sedes.length?sedes:['Sede Principal']
  };
}

// Attach parametrización events
function attachParamsEvents(){
  // Sub-tab switching
  document.querySelectorAll('[data-ptab]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      STATE._paramsTab = btn.dataset.ptab;
      window._editingEmpresa = null;
      window._editingUsuario = null;
      const app = document.getElementById('app');
      app.innerHTML = renderParams();
      attachParamsEvents();
    });
  });

  document.getElementById('params-back')?.addEventListener('click',()=>{
    window._editingEmpresa=null; window._editingUsuario=null;
    window._logoTemp={}; STATE.adminView='panel'; render();
  });

  const tab = STATE._paramsTab||'empresas';
  if(tab==='empresas'){
    document.getElementById('params-new-empresa')?.addEventListener('click',()=>{
      const empresas=loadEmpresas(), newId=genEmpId();
      empresas.push({id:newId,nombre:'',nit:'',direccion:'',telefono:'',logo:'',sedes:['Sede Principal']});
      saveEmpresas(empresas);
      window._editingEmpresa=newId;
      reloadParamsList();
    });
    loadEmpresas().forEach(emp=>{
      document.getElementById('edit-emp-'+emp.id)?.addEventListener('click',()=>{
        window._editingEmpresa=emp.id; reloadParamsList();
      });
      document.getElementById('del-emp-'+emp.id)?.addEventListener('click',()=>{
        if(!confirm('¿Eliminar "'+emp.nombre+'"?')) return;
        saveEmpresas(loadEmpresas().filter(e=>e.id!==emp.id));
        reloadParamsList(); showToast('Empresa eliminada','ok');
      });
      document.getElementById('cancel-emp-'+emp.id)?.addEventListener('click',()=>{
        const all=loadEmpresas(), e=all.find(x=>x.id===emp.id);
        if(e&&!e.nombre) saveEmpresas(all.filter(x=>x.id!==emp.id));
        window._editingEmpresa=null; reloadParamsList();
      });
      document.getElementById('save-emp-'+emp.id)?.addEventListener('click',()=>{
        const data=readEmpresaForm(emp.id); if(!data) return;
        const all=loadEmpresas(), idx=all.findIndex(e=>e.id===emp.id);
        if(idx>=0) all[idx]={...all[idx],...data};
        saveEmpresas(all);
        window._editingEmpresa=null;
        if(window._logoTemp) delete window._logoTemp[emp.id];
        reloadParamsList();
        showToast('✓ Empresa guardada','ok');
      });
    });
  } else {
    attachParamsUsuariosEvents();
  }
}


function reloadParamsList(){
  const list = document.getElementById('params-list');
  if(!list) return;
  list.innerHTML = loadEmpresas().map((emp,i)=>renderEmpresaCard(emp,i)).join('');
  attachParamsEvents();
}



// ══ NOTIFICATION SYSTEM ══════════════════════════════════════════════════════
let _lastSolCount = null;
let _notifInterval = null;
let _notifGranted  = false;

function requestNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'granted'){
    _notifGranted = true;
  } else if(Notification.permission !== 'denied'){
    Notification.requestPermission().then(p=>{
      _notifGranted = p === 'granted';
    });
  }
}

function playNotifSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1100, ctx.currentTime+0.1);
    osc.frequency.setValueAtTime(880, ctx.currentTime+0.2);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.5);
  }catch(e){}
}

function showNotification(nuevas){
  const n = nuevas.length;
  const titulo = n===1
    ? `📋 Nueva solicitud de ${nuevas[0].requester?.name||'desconocido'}`
    : `📋 ${n} nuevas solicitudes`;
  const cuerpo = n===1
    ? `${nuevas[0].id} · ${nuevas[0].requester?.company||''} · ${(nuevas[0].items||[]).map(i=>i.type).join(', ')}`
    : nuevas.map(r=>r.id+' — '+r.requester?.name).join('\n');

  // Browser notification
  if(_notifGranted && Notification.permission==='granted'){
    const notif = new Notification(titulo, {
      body: cuerpo,
      icon: 'https://yefersonhardwareitm.github.io/solicitudes-compra-tic/favicon.ico',
      badge: 'https://yefersonhardwareitm.github.io/solicitudes-compra-tic/favicon.ico',
      tag: 'tic-nueva-solicitud',
      requireInteraction: true
    });
    notif.onclick = ()=>{ window.focus(); notif.close(); };
  }

  // In-page toast
  showToast(titulo, 'info');
  playNotifSound();

  // Update page title with badge
  updateTitleBadge(n);
}

let _titleBadge = 0;
function updateTitleBadge(n){
  _titleBadge += n;
  if(_titleBadge > 0){
    document.title = `(${_titleBadge}) SolicitudTIC — Panel de Compras`;
  }
}
function clearTitleBadge(){
  _titleBadge = 0;
  document.title = 'SolicitudTIC — Dpto. de Tecnología';
}

async function checkForNewSolicitudes(){
  if(!STATE.adminAuth) return;
  try{
    CACHE_SOL = null;
    const sols = await getSolicitudes();
    if(_lastSolCount === null){
      _lastSolCount = sols.length;
      return;
    }
    if(sols.length > _lastSolCount){
      const nuevas = sols.slice(_lastSolCount); // newest are at end
      _lastSolCount = sols.length;
      STATE.solicitudes = sols;
      showNotification(nuevas);
      // Refresh sidebar silently
      refreshSidebar();
    }
  }catch(e){ /* silent */ }
}

function startNotifPolling(){
  requestNotifPermission();
  if(_notifInterval) clearInterval(_notifInterval);
  _notifInterval = setInterval(checkForNewSolicitudes, 30000); // every 30 sec
  // First check after 5 seconds
  setTimeout(()=>{ _lastSolCount = STATE.solicitudes.length; }, 5000);
}

function stopNotifPolling(){
  if(_notifInterval){ clearInterval(_notifInterval); _notifInterval=null; }
}

async function boot(){
  // Clear badge when user returns to tab
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && STATE.adminAuth) clearTitleBadge();
  });
  // Auto-buscar si viene desde link del correo
  const urlParams = new URLSearchParams(window.location.search);
  const buscarId = urlParams.get('buscar');
  if(buscarId && STATE.mode==='public'){
    STATE.publicTab = 'track';
    STATE.trackQ = buscarId.toUpperCase();
  }
  showLoading('Conectando con la base de datos...');
  try{
    await initBins();
    hideLoading();
    if(STATE.mode==='admin' && STATE.adminAuth){
      await loadAdminData();
    } else {
      render();
      // Auto-ejecutar búsqueda si viene del link del correo
      const urlParams = new URLSearchParams(window.location.search);
      const buscarId = urlParams.get('buscar');
      if(buscarId && STATE.mode==='public'){
        setTimeout(async()=>{
          const all = await getSolicitudes();
          const r = all.find(x=>x.id===buscarId.toUpperCase());
          if(r){ setState({trackRec:r, trackErr:''}); }
          else { setState({trackErr:'No se encontró la solicitud '+buscarId}); }
        }, 500);
      }
    }
  }catch(e){
    hideLoading();
    console.error('Boot error:', e);
    // Still render the app, just without cloud data
    render();
    showToast('⚠ Sin conexión a la nube: '+e.message, 'err');
  }
}


function updateOCTotals(){
  const oc = readOCFromDOM();
  STATE.oc = oc;
  const items = oc.items||[];
  let subtotal=0, totalIva=0;
  items.forEach(it=>{
    const q=parseFloat(it.cantidad||0), vu=parseFloat(it.valorUnitario||0), iv=(parseFloat(it.iva||19))/100;
    subtotal += q*vu;
    totalIva += q*vu*iv;
  });
  const desc = parseFloat(oc.descuento||0);
  const total = subtotal+totalIva-desc;

  function fmtCOP(v){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0}).format(v||0); }

  // Update computed cells (read-only display cells)
  oc.items.forEach((it,i)=>{
    const q=parseFloat(it.cantidad||0), vu=parseFloat(it.valorUnitario||0), iv=(parseFloat(it.iva||19))/100;
    const sin=q*vu, tiva=sin*iv, tot=sin+tiva;
    const sinEl=document.getElementById('oc_calc_sin_'+i);
    const tivaEl=document.getElementById('oc_calc_tiva_'+i);
    const totEl=document.getElementById('oc_calc_tot_'+i);
    if(sinEl) sinEl.textContent = sin>0?fmtCOP(sin):'—';
    if(tivaEl) tivaEl.textContent = tiva>0?fmtCOP(tiva):'—';
    if(totEl) totEl.textContent = tot>0?fmtCOP(tot):'—';
  });

  // Update summary totals
  const subEl=document.getElementById('oc_total_subtotal');
  const ivaEl=document.getElementById('oc_total_iva');
  const totEl=document.getElementById('oc_total_total');
  if(subEl) subEl.textContent=fmtCOP(subtotal);
  if(ivaEl) ivaEl.textContent=fmtCOP(totalIva);
  if(totEl) totEl.textContent=fmtCOP(total);
}
