<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f14;--surface:#141920;--surface2:#1a2130;--border:#252d3a;
  --accent:#3b9eff;--success:#34c77b;--warning:#f0a429;--danger:#f05252;
  --text:#e2eaf4;--muted:#6b7a94;--radius:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,select,textarea{font-family:'DM Sans',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .32s ease both}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}

/* ── Layout ── */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:62px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-icon{width:30px;height:30px;background:var(--accent);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.nav-title{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;line-height:1}
.nav-sub{font-size:10px;color:var(--muted);margin-top:1px}
.nav-tabs{display:flex;gap:4px;flex-wrap:wrap}
.nav-tab{padding:7px 15px;background:transparent;border:none;border-radius:8px;
  color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.nav-tab.active{background:var(--accent);color:#fff}

/* ── Components ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;
  letter-spacing:.4px;text-transform:uppercase}
.field .req{color:var(--accent);margin-left:3px}
.field .hint{font-size:11px;color:var(--muted);margin-top:3px}
.inp,.sel,.ta{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif}
.sel{cursor:pointer}
.ta{resize:vertical}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent)}
.btn{padding:11px 22px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:14px;cursor:pointer;transition:opacity .18s,transform .1s;color:#fff}
.btn:hover{opacity:.8;transform:translateY(-1px)}
.btn-primary{background:var(--accent)}
.btn-success{background:var(--success)}
.btn-danger{background:var(--danger)}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-warning{background:var(--warning)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-full{width:100%}
.btn-purple{background:#7c3aed}
.divider{height:1px;background:var(--border);margin:18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.span2{grid-column:1/-1}
.page{max-width:740px;margin:0 auto;padding:34px 22px}

/* ── Admin layout ── */
.admin-wrap{display:flex;flex-direction:column;height:100vh}
.admin-header{display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:58px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;gap:12px;flex-wrap:wrap}
.admin-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:285px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:10px}
.main-area{flex:1;overflow-y:auto;padding:22px}
.sol-card{padding:11px 13px;border-radius:10px;margin-bottom:7px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);transition:all .2s}
.sol-card:hover{border-color:var(--accent)}
.sol-card.active{border-color:var(--accent);background:#3b9eff0d}
.sol-card-id{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--accent)}
.sol-card-name{font-size:13px;font-weight:500;margin-bottom:2px}
.sol-card-items{font-size:11px;color:var(--muted);margin-bottom:5px}
.sol-card-bar-wrap{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.sol-card-bar{height:100%;border-radius:2px;transition:width .3s}
.sol-card-date{font-size:10px;color:var(--muted);margin-top:4px}
.acord-empresa{border-bottom:1px solid var(--border);overflow:hidden}
.acord-empresa-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--surface);transition:background .2s;gap:8px}
.acord-empresa-hdr:hover{background:var(--surface2)}
.acord-empresa-hdr.open{background:var(--surface2);border-left:3px solid var(--accent)}
.acord-mes-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 14px 7px 22px;cursor:pointer;background:var(--surface2);transition:background .15s;gap:6px;border-bottom:1px solid var(--border)}
.acord-mes-hdr:hover{background:#1f2a3a}
.acord-mes-hdr.open{color:var(--accent)}
.acord-cards{padding:6px 8px 6px 8px;background:var(--bg)}

/* ── Detail tabs ── */
.detail-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.detail-tab{padding:9px 18px;background:transparent;border:none;
  border-bottom:2px solid transparent;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.detail-tab.active{border-bottom-color:var(--accent);color:var(--accent)}

/* ── Progress ── */
.progress-bar-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.progress-bar-bg{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:4px;transition:width .6s}
.progress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:7px}
.progress-step{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2)}
.progress-step.done{border-color:#34c77b44;background:#34c77b0a;opacity:1}
.progress-step.active{border-color:var(--accent);background:#3b9eff0a;opacity:1}
.progress-step.pending{opacity:.45}

/* ── OC items table ── */
.oc-table{width:100%;border-collapse:collapse;font-size:13px}
.oc-table th{background:var(--surface2);padding:8px 6px;text-align:center;font-size:11px;
  font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.oc-table td{padding:4px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
.oc-table td.num{text-align:right;color:var(--muted);padding:0 8px}
.oc-table td.idx{text-align:center;color:var(--muted);font-size:12px}
.totals-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
.total-final{display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid var(--accent);margin-top:4px}
.cancelled-banner{background:#f0525222;border:1px solid var(--danger);border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.sum-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.sum-label{color:var(--muted);font-weight:500;min-width:140px;flex-shrink:0}
.sum-val{color:var(--text);text-align:right;flex:1}
.sum-section{margin-bottom:18px}
.sum-section-title{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.sum-equip-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px}

/* ── History ── */
.history-item{display:flex;gap:11px;margin-bottom:12px}
.history-dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0;margin-top:3px}
.history-line{width:1px;flex:1;background:var(--border);margin-top:3px}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;
  font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#toast.ok{background:#34c77b;color:#fff}
#toast.err{background:var(--danger);color:#fff}
#toast.info{background:var(--accent);color:#fff}

/* ── Loading overlay ── */
#loading-overlay{position:fixed;inset:0;background:#0b0f14cc;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:9998;gap:16px}
#loading-overlay p{color:var(--text);font-size:15px}

/* ── Responsive ── */
@media(max-width:700px){
  .grid2{grid-template-columns:1fr}
  .span2{grid-column:1}
  .admin-body{flex-direction:column}
  .sidebar{width:100%;max-height:220px;border-right:none;border-bottom:1px solid var(--border)}
  .main-area{padding:14px}
  nav{height:auto;padding:10px 14px}
  .oc-table{font-size:11px}
}
</style>
</head>

<div style="position:fixed;bottom:10px;left:10px;z-index:99999;background:#141920cc;border:1px solid #3b9eff44;border-radius:8px;padding:4px 10px;font-size:11px;font-family:monospace;color:#3b9eff;pointer-events:none">v2026.05.15-b1</div>

<div id="toast"></div>
<div id="loading-overlay" style="display:none">

</div>

<div id="app"></div>

<!-- Summary Modal -->
<div id="summary-modal" style="display:none;position:fixed;inset:0;background:#000000bb;z-index:9990;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px">
  <div id="summary-box" style="background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;margin:auto;overflow:hidden">
    <!-- Header -->
    <div style="background:var(--surface2);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <h3 style="font-family:'Syne',sans-serif;font-size:18px;margin:0;margin-bottom:2px">Resumen de la Solicitud</h3>
        <p style="font-size:12px;color:var(--muted);margin:0">Verifica que todo esté correcto antes de enviar</p>
      </div>
      <button onclick="closeSummary()" style="background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px">✕</button>
    </div>
    <!-- Content -->
    <div id="summary-content" style="padding:24px"></div>
    <!-- Footer -->
    <div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:var(--surface2)">
      <button onclick="closeSummary()" style="padding:10px 20px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer">
        ✏️ Editar
      </button>
      <button onclick="confirmAndSubmit()" id="confirm-send-btn" style="padding:10px 24px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer">
        ✅ Confirmar y Enviar
      </button>
    </div>
  </div>
</div>

<!-- Cancel Modal -->
<div id="cancel-modal" style="display:none;position:fixed;inset:0;background:#000000aa;z-index:9990;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--danger);border-radius:16px;padding:32px;max-width:420px;width:90%;margin:auto">
    <div style="font-size:40px;text-align:center;margin-bottom:12px">⚠️</div>
    <h3 style="font-family:'Syne',sans-serif;font-size:18px;text-align:center;margin-bottom:10px">¿Cancelar solicitud?</h3>
    <p style="color:var(--muted);font-size:13px;text-align:center;margin-bottom:20px;line-height:1.6">
      Esta acción notificará al Departamento de Compras que ya <strong style="color:var(--text)">no se requiere</strong> la compra del insumo solicitado.
    </p>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">Motivo de cancelación <span style="color:var(--danger)">*</span></label>
      <textarea id="cancel-reason" rows="3" placeholder="Explique brevemente por qué ya no se requiere..." style="width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;resize:none;font-family:'DM Sans',sans-serif"></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="closeCancel()" style="flex:1;padding:11px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer">Volver</button>
      <button onclick="confirmCancel()" style="flex:1;padding:11px;background:var(--danger);border:none;border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer">Sí, cancelar solicitud</button>
    </div>
  </div>
</div>

let BIN_SOL = null; // bin ID for solicitudes
let BIN_OC  = null; // bin ID for ordenes de compra

function getBinIds(){
  try{ const d=JSON.parse(localStorage.getItem(BIN_IDS_KEY)); return d||{}; }catch{ return {}; }
}
function saveBinIds(d){ localStorage.setItem(BIN_IDS_KEY, JSON.stringify(d)); }

async function createBin(name, data){
  const r = await fetch(JSONBIN_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY,'X-Bin-Name':name,'X-Bin-Private':'true'},
    body: JSON.stringify(data)
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error creando bin');
  return j.metadata.id;
}

async function fetchWithTimeout(url, opts={}, ms=10000){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {...opts, signal:ctrl.signal});
    clearTimeout(timer);
    return r;
  }catch(e){
    clearTimeout(timer);
    throw new Error('Sin conexión o tiempo agotado. Verifica tu internet.');
  }
}

async function readBin(id){
  const r = await fetchWithTimeout(`${JSONBIN_URL}/${id}/latest`,{
    headers:{'X-Master-Key':JSONBIN_KEY, 'X-Bin-Meta':'false'}
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error leyendo bin');
  return j.record || j;
}

async function updateBin(id, data){
  const r = await fetchWithTimeout(`${JSONBIN_URL}/${id}`,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
    body: JSON.stringify(data)
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error actualizando bin');
  return j.record;
}

async function initBins(){
  // Usar siempre los bins fijos — mismo dato en todos los dispositivos
  BIN_SOL = FIXED_BIN_SOL;
  BIN_OC  = FIXED_BIN_OC;
}

// ── In-memory cache to reduce API calls ──
let CACHE_SOL = null;
let CACHE_OC  = null;
let CACHE_SOL_TS = 0;
let CACHE_OC_TS  = 0;
const CACHE_TTL = 8000; // 8 seconds

async function getSolicitudes(){
  if(CACHE_SOL && Date.now()-CACHE_SOL_TS < CACHE_TTL) return [...CACHE_SOL];
  try{
    const d = await readBin(BIN_SOL);
    CACHE_SOL = d.solicitudes||d||[];
    CACHE_SOL_TS = Date.now();
  }catch(e){
    console.warn('getSolicitudes error:', e);
    if(!CACHE_SOL) CACHE_SOL = [];
  }
  return [...CACHE_SOL];
}
async function saveSolicitudes(arr){
  CACHE_SOL = arr;
  CACHE_SOL_TS = Date.now();
  await updateBin(BIN_SOL, {solicitudes:arr});
}
async function getOrdenes(){
  if(CACHE_OC && Date.now()-CACHE_OC_TS < CACHE_TTL) return {...CACHE_OC};
  try{
    const d = await readBin(BIN_OC);
    CACHE_OC = d.ordenes||{};
    CACHE_OC_TS = Date.now();
  }catch(e){
    console.warn('getOrdenes error:', e);
    if(!CACHE_OC) CACHE_OC = {};
  }
  return {...CACHE_OC};
}
async function saveOrdenes(obj){
  CACHE_OC = obj;
  CACHE_OC_TS = Date.now();
  await updateBin(BIN_OC, {ordenes:obj});
}

function h(tag, attrs='', ...children){
  return `<${tag} ${attrs}>${children.join('')}</${tag}>`;
}
function inp(id,val,ph='',type='text',extra=''){
  return `<input class="inp" id="${id}" type="${type}" value="${escH(val)}" placeholder="${escH(ph)}" ${extra}/>`;
}
function sel(id,val,opts,ph='-- Seleccionar --'){
  const options=[`<option value="">${ph}</option>`,...opts.map(o=>`<option value="${escH(o)}" ${val===o?'selected':''}>${escH(o)}</option>`)];
  return `<select class="sel" id="${id}">${options.join('')}</select>`;
}
function ta(id,val,ph=''){
  return `<textarea class="ta" id="${id}" rows="3" placeholder="${escH(ph)}">${escH(val)}</textarea>`;
}
function btn(label,cls,id='',style=''){
  return `<button class="btn ${cls}" id="${id}" style="${style}">${label}</button>`;
}
function field(label,req,content,hint=''){
  return `<div class="field"><label>${escH(label)}${req?'<span class="req">*</span>':''}</label>${content}${hint?`<p class="hint">${hint}</p>`:''}</div>`;
}
function badge(label,color){
  return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}</span>`;
}
function card(content,style=''){
  return `<div class="card" style="${style}">${content}</div>`;
}
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function progressTracker(currentStep){
  const pct=Math.round((currentStep/STEPS.length)*100);

    <div class="progress-bar-wrap">

        ${pct===100?'✓ Completado':pct+'% completado'}
      </span>
    </div>
    <div class="progress-grid">
      ${STEPS.map(s=>{
        const done=s.id<currentStep,active=s.id===currentStep,pending=s.id>currentStep;

          <span style="font-size:15px">${s.icon}</span>

            </p>
            <p style="font-size:12px;font-weight:500">${s.label}</p>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function carpetaMover(solId, idx, dir){
  const carpeta=loadCarpetas(); if(!carpeta[solId]) return;
  const arr=carpeta[solId].archivos, ni=idx+dir;
  if(ni<0||ni>=arr.length) return;
  [arr[idx],arr[ni]]=[arr[ni],arr[idx]];
  carpeta[solId].archivos=arr; saveCarpetas(carpeta);
  // Re-render only the carpeta area
  const main=document.querySelector('.main-area');
  if(main){
    const sr=STATE.solicitudes.find(r=>r.id===solId);
    const tabs=main.querySelector('.detail-tabs');
    const container=document.getElementById('carpeta-container');
    if(container) container.outerHTML=carpetaFormHTML(sr);
    attachCarpetaEvents();
  }
}

function carpetaEliminar(solId, idx){
  const carpeta=loadCarpetas(); if(!carpeta[solId]) return;
  carpeta[solId].archivos.splice(idx,1); saveCarpetas(carpeta);
  const main=document.querySelector('.main-area');
  if(main){
    const sr=STATE.solicitudes.find(r=>r.id===solId);
    const container=document.getElementById('carpeta-container');
    if(container){ container.outerHTML=carpetaFormHTML(sr); attachCarpetaEvents(); }
  }
}

function attachCarpetaEvents(){
  document.getElementById('carpeta-upload')?.addEventListener('change', async(e)=>{
    const files=Array.from(e.target.files); if(!files.length) return;
    showLoading('Leyendo archivos...');
    const carpeta=loadCarpetas(), id=STATE.selectedId;
    if(!carpeta[id]) carpeta[id]={archivos:[]};
    for(const file of files){
      try{
        const ab=await file.arrayBuffer();
        const b64=btoa(String.fromCharCode(...new Uint8Array(ab)));
        carpeta[id].archivos.push({name:file.name, data:b64, size:(file.size/1024).toFixed(0)+'KB'});
      }catch(e){ console.warn('Error reading file:', file.name); }
    }
    saveCarpetas(carpeta); hideLoading();
    showToast('✓ '+files.length+' archivo(s) subido(s)','ok');
    const sr=STATE.solicitudes.find(r=>r.id===id);
    const container=document.getElementById('carpeta-container');
    if(container){ container.outerHTML=carpetaFormHTML(sr); attachCarpetaEvents(); }
    e.target.value='';
  });

  document.getElementById('carpeta-download')?.addEventListener('click', async()=>{
    const id=STATE.selectedId;
    const carpeta=loadCarpetas()[id];
    if(!carpeta?.archivos?.length){ showToast('No hay archivos en la carpeta','err'); return; }
    showLoading('Combinando PDFs...');
    try{
      if(typeof PDFLib==='undefined'){ showToast('Librería no cargada, espera un momento','err'); hideLoading(); return; }
      const{PDFDocument}=PDFLib;
      const merged=await PDFDocument.create();
      for(const archivo of carpeta.archivos){
        try{
          const bytes=Uint8Array.from(atob(archivo.data),c=>c.charCodeAt(0));
          const src=await PDFDocument.load(bytes,{ignoreEncryption:true});
          const pages=await merged.copyPages(src,src.getPageIndices());
          pages.forEach(p=>merged.addPage(p));
        }catch(e){ console.warn('Saltando archivo con error:', archivo.name); }
      }
      const pdfBytes=await merged.save();
      const blob=new Blob([pdfBytes],{type:'application/pdf'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`CarpetaCompra_${id}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.pdf`;
      a.click(); URL.revokeObjectURL(url);
      showToast('✓ Carpeta de compra descargada','ok');
    }catch(e){ showToast('Error: '+e.message,'err'); }
    hideLoading();
  });
}

// ══ ACCORDION SIDEBAR ════════════════════════════════════════════════════════
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function buildAccordionSidebar(filtered, selectedId, ordenes){
  if(!filtered || !filtered.length) return '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px;padding:14px">Sin solicitudes</p>';

  const grouped = {};
  filtered.forEach(r => {
    const empresa = (r.requester && r.requester.company) ? r.requester.company : 'Sin empresa';
    const fecha = new Date(r.createdAt);
    const mesKey = isNaN(fecha.getTime()) ? 'Sin fecha' : MESES[fecha.getMonth()] + ' ' + fecha.getFullYear();
    if(!grouped[empresa]) grouped[empresa] = {};
    if(!grouped[empresa][mesKey]) grouped[empresa][mesKey] = [];
    grouped[empresa][mesKey].push(r);
  });

  if(!STATE._openEmpresas) STATE._openEmpresas = {};
  if(!STATE._openMeses)    STATE._openMeses    = {};

  let out = '';
  Object.entries(grouped).forEach(([empresa, meses]) => {
    const empOpen = STATE._openEmpresas[empresa] !== false;
    const total   = Object.values(meses).reduce((s,a)=>s+a.length,0);
    const hasSel  = Object.values(meses).some(arr=>arr.some(r=>r.id===selectedId));
    const isOpen  = empOpen || hasSel;

    out += `<div style="border-bottom:1px solid var(--border)">
      <div onclick="toggleEmpresa('${escH(empresa)}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--surface);gap:8px;${isOpen?'border-left:3px solid var(--accent)':''}">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <span style="font-size:15px">🏢</span>
          <div style="min-width:0">
            <p style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(empresa)}</p>
            <p style="font-size:10px;color:var(--muted)">${total} solicitud${total!==1?'es':''}</p>
          </div>
        </div>
        <span style="color:var(--muted);font-size:14px;transform:rotate(${isOpen?90:0}deg);display:inline-block;transition:transform .2s">›</span>
      </div>`;

    if(isOpen){
      out += '<div>';
      Object.entries(meses).forEach(([mes, reqs]) => {
        const mk     = empresa + '__' + mes;
        const mOpen  = STATE._openMeses[mk] !== false;
        const mSel   = reqs.some(r=>r.id===selectedId);
        const mIsOpen= mOpen || mSel;

        out += `<div>
          <div onclick="toggleMes('${escH(empresa)}','${escH(mes)}')" style="display:flex;align-items:center;justify-content:space-between;padding:7px 14px 7px 26px;cursor:pointer;background:var(--surface2);border-bottom:1px solid var(--border);gap:6px">
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-size:12px">📅</span>
              <span style="font-size:12px;font-weight:600;${mIsOpen?'color:var(--accent)':''}">${escH(mes)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:5px">
              <span style="background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:10px;padding:1px 6px;font-weight:600">${reqs.length}</span>
              <span style="color:var(--muted);font-size:12px;transform:rotate(${mIsOpen?90:0}deg);display:inline-block">›</span>
            </div>
          </div>`;

        if(mIsOpen){
          out += '<div style="padding:6px 8px;background:var(--bg)">';
          reqs.forEach(r => {
            const pct  = Math.round((r.currentStep/STEPS.length)*100);
            const done = r.currentStep >= STEPS.length;
            const hasOC= !!(ordenes && ordenes[r.id]);
            const act  = r.id === selectedId;
            out += `<div class="sol-card ${act?'active':''}" data-id="${r.id}">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
                <span class="sol-card-id">${escH(r.id)}</span>
                <div style="display:flex;gap:3px">
                  ${r.cancelled?badge('🚫','var(--danger)'):(done?badge('✓','var(--success)'):badge(pct+'%','var(--warning)'))}
                  ${hasOC?badge('OC','var(--success)'):''}
                </div>
              </div>
              <p class="sol-card-name">${escH((r.requester&&r.requester.name)||'')}</p>
              <p class="sol-card-items">${(r.items||[]).map(i=>i.qty+'× '+escH(i.type)).join(', ')}</p>
              <div class="sol-card-bar-wrap"><div class="sol-card-bar" style="width:${pct}%;background:${done?'var(--success)':'var(--accent)'}"></div></div>
            </div>`;
          });
          out += '</div>';
        }
        out += '</div>';
      });
      out += '</div>';
    }
    out += '</div>';
  });
  return out;
}

function toggleEmpresa(empresa){
  if(!STATE._openEmpresas) STATE._openEmpresas = {};
  STATE._openEmpresas[empresa] = STATE._openEmpresas[empresa] === false ? true : false;
  refreshSidebar();
}

function toggleMes(empresa, mes){
  if(!STATE._openMeses) STATE._openMeses = {};
  const key = empresa + '__' + mes;
  STATE._openMeses[key] = STATE._openMeses[key] === false ? true : false;
  refreshSidebar();
}

function refreshSidebar(){
  const sidebar = document.querySelector('.sidebar');
  if(!sidebar) return;
  const filtered = [...STATE.solicitudes].reverse().filter(r=>{
    if(STATE.filter==='active' && r.currentStep>=STEPS.length) return false;
    if(STATE.filter==='done'   && r.currentStep<STEPS.length)  return false;
    if(STATE.srch && !r.id.includes(STATE.srch.toUpperCase()) && !(r.requester&&r.requester.name&&r.requester.name.toLowerCase().includes(STATE.srch.toLowerCase()))) return false;
    return true;
  });
  sidebar.innerHTML = buildAccordionSidebar(filtered, STATE.selectedId, STATE.ordenes);
  attachSolCards();
}

        ${card(`

          <p style="font-size:12px;color:var(--muted);margin-bottom:5px">${escH(sel_rec.assignee?.position||'')}</p>
          <p style="font-size:12px">🪪 ${escH(sel_rec.assignee?.cedula||'')}</p>
          <p style="font-size:12px">📞 ${escH(sel_rec.assignee?.phone||'')}</p>
          <p style="font-size:12px;color:var(--accent)">✉ ${escH(sel_rec.assignee?.email||'')}</p>

        ${card(`
          <p style="font-size:10px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:600">

          </p>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px">
            ${(sel_rec.items||[]).map(it=>`
              <div style="background:var(--surface2);padding:9px 12px;border-radius:8px">
                <p style="font-weight:600;margin-bottom:3px">
                  <span style="background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;margin-right:6px">${it.qty}×</span>${escH(it.type)}
                </p>
                ${it.qty>1?(it.assignees||[]).map((a,j)=>`<p style="font-size:11px;color:var(--muted);margin-top:2px">U${j+1}: ${escH(a.name||'—')} · ${escH(a.cedula||'—')}</p>`).join(''):''}
              </div>`).join('')}
          </div>
        `,'grid-column:1/-1')}
      </div>

      ${card(`<h3 style="font-size:15px;margin-bottom:14px">Progreso del proceso</h3>${progressTracker(sel_rec.currentStep)}`,'margin-bottom:14px')}

      ${card(`
        <h3 style="font-size:15px;margin-bottom:14px">Historial de actividad</h3>
        <div style="max-height:300px;overflow-y:auto;padding-right:4px">
          ${[...(sel_rec.history||[])].reverse().map((h,i,arr)=>`
            <div class="history-item">
              <div style="display:flex;flex-direction:column;align-items:center;padding-top:3px">
                <div class="history-dot"></div>
                ${i<arr.length-1?'<div class="history-line"></div>':''}
              </div>
              <div style="padding-bottom:10px">
                <p style="font-weight:600;font-size:13px">${escH(h.label)}</p>
                <p style="font-size:11px;color:var(--muted);margin-bottom:${h.note?3:0}px">${escH(h.date)}</p>
                ${h.note?`<p style="font-size:11px;background:var(--surface2);padding:3px 9px;border-radius:6px;display:inline-block">📝 ${escH(h.note)}</p>`:''}
              </div>
            </div>`).join('')}
        </div>
      `)}
    </div>`;
  } else if(detailTab==='carpeta'){
    detailContent = carpetaFormHTML(sel_rec);
  } else if(detailTab==='requisicion'){
    const allReqs=loadREQs(),savedReq=allReqs[sel_rec.id],reqData=savedReq||emptyREQ();
    if(!savedReq){
      reqData.nombre=sel_rec.requester?.name||''; reqData.empresa=sel_rec.requester?.company||'';
      reqData.cargo=sel_rec.requester?.position||''; reqData.area=sel_rec.requester?.area||'';
      reqData.fechaSolicitud=new Date().toLocaleDateString('es-CO');
      reqData.elaboro=sel_rec.requester?.name||'';
    }
    detailContent=reqFormHTML(reqData,sel_rec);
  } else if(detailTab==='orden'){
    detailContent = ocForm(STATE.oc, sel_rec);
  }

  return `<div class="admin-wrap">
    <div class="admin-header">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px">⚙️</div>
          <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">Panel de Compras TIC</span>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${['all','active','done'].map((k,_,a)=>{
            const labels={all:'Todas',active:'En curso',done:'Completadas'};
            const counts={all:stats.total,active:stats.active,done:stats.done};
            return `<button class="btn btn-sm ${filter===k?'btn-primary':'btn-ghost'}" data-filter="${k}">${labels[k]} <strong>${counts[k]}</strong></button>`;
          }).join('')}
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input class="inp" id="admin-search" value="${escH(srch)}" placeholder="Buscar ID o nombre..." style="width:200px;font-size:12px"/>
        ${btn('↻','btn btn-ghost btn-sm','do-refresh')}
        ${btn('Sincronizar nube','btn btn-ghost btn-sm','do-sync','font-size:11px')}
        ${btn('Salir','btn btn-danger btn-sm','do-logout')}
      </div>
    </div>
    <div class="admin-body">
      <div class="sidebar" style="padding:0">
        ${buildAccordionSidebar(filtered, selectedId, ordenes)}
      </div>
      <div class="main-area">
        ${sel_rec?`
          <div class="detail-tabs">
            <button class="detail-tab ${detailTab==='gestion'?'active':''}" data-dtab="gestion">⚙️ Gestión</button>
            <button class="detail-tab ${detailTab==='orden'?'active':''}" data-dtab="orden">
              📄 Orden de Compra${ordenes[sel_rec.id]?'<span style="width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;margin-left:6px"></span>':''}
            </button>
          <button class="detail-tab ${detailTab==='requisicion'?'active':''}" data-dtab="requisicion">📋 Requisición${loadREQs()[sel_rec.id]?'<span style="width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;margin-left:6px"></span>':''}</button>
          <button class="detail-tab ${detailTab==='carpeta'?'active':''}" data-dtab="carpeta">📁 Carpeta de Compra</button>
          </div>`:''}
        ${detailContent}
      </div>
    </div>
  </div>`;
}

function readOCFromDOM(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const items=STATE.oc.items.map((_,i)=>({
    descripcion:g('oc_item_desc_'+i),
    cantidad:g('oc_item_qty_'+i),
    valorUnitario:g('oc_item_vu_'+i),
    iva:g('oc_item_iva_'+i)||19
  }));
  return {
    numeroOrden:g('oc_numeroOrden'),fecha:g('oc_fecha'),proveedor:g('oc_proveedor'),
    formaPago:g('oc_formaPago'),nit:g('oc_nit'),cotizacion:g('oc_cotizacion'),
    direccion:g('oc_direccion'),telefono:g('oc_telefono'),
    elaboradoPor:g('oc_elaboradoPor'),cargoElabora:g('oc_cargoElabora'),
    observaciones:g('oc_obs'),descuento:g('oc_descuento')||0,items
  };
}


function attachSolCards(){
  document.querySelectorAll('.sol-card[data-id]').forEach(el=>{
    el.addEventListener('click',async()=>{
      const id=el.dataset.id;
      const ords=await getOrdenes();
      const oc=ords[id]||emptyOC();
      STATE.selectedId=id; STATE.oc=oc; STATE.detailTab='gestion';
      const app=document.getElementById('app');
      app.innerHTML=STATE.adminAuth?renderAdmin():renderLogin();
      attachEvents();
    });
  });
}

function attachEvents(){
  // ── Public tabs ──
  document.getElementById('tab-form')?.addEventListener('click',()=>setState({publicTab:'form',formSent:null}));
  document.getElementById('tab-track')?.addEventListener('click',()=>setState({publicTab:'track'}));

  // ── Form ──
  document.getElementById('same-check')?.addEventListener('change',e=>setState({same:e.target.checked}));
  document.getElementById('motive')?.addEventListener('change',e=>setState({motive:e.target.value}));
  document.getElementById('other-motive')?.addEventListener('input',e=>setState({other:e.target.value}));
  document.getElementById('add-item')?.addEventListener('click',()=>{
    setState({items:[...STATE.items,emptyItem()]});
  });
  // Remove item
  document.querySelectorAll('[id^="rem-item-"]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.id.replace('rem-item-',''));
      setState({items:STATE.items.filter((_,j)=>j!==i)});
    });
  });
  // Item type/qty change
  STATE.items.forEach((_,i)=>{
    document.getElementById('item_type_'+i)?.addEventListener('change',e=>{
      const items=[...STATE.items]; items[i]={...items[i],type:e.target.value}; setState({items});
    });
    document.getElementById('item_qty_'+i)?.addEventListener('change',e=>{
      const qty=Math.max(1,parseInt(e.target.value)||1);
      const items=[...STATE.items];
      const cur=items[i].assignees;
      items[i]={...items[i],qty,assignees:Array.from({length:qty},(_,j)=>cur[j]||{name:'',cedula:'',position:'',phone:'',email:'',company:'',area:''})};
      setState({items});
    });
    // Assignee fields — desde índice 1 (unidad 2 en adelante)
    STATE.items[i]?.assignees?.forEach((_,j)=>{
      if(j===0) return; // unidad 1 = solicitante, no se captura
      ['name','cedula','position','phone','email','company','area'].forEach(fld=>{
        document.getElementById(`asg_${i}_${j}_${fld}`)?.addEventListener('input',e=>{
          const items=[...STATE.items]; const a=[...items[i].assignees];
          a[j]={...a[j],[fld]:e.target.value};
          items[i]={...items[i],assignees:a}; STATE.items=items;
        });
      });
    });
  });

  // Person fields
  ['req_name','req_position','req_cedula','req_phone','req_email','req_company','req_area'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',e=>{
      const k=id.replace('req_',''); STATE.req={...STATE.req,[k]:e.target.value};
    });
  });
  ['asg_name','asg_position','asg_cedula','asg_phone','asg_email','asg_company','asg_area'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',e=>{
      const k=id.replace('asg_',''); STATE.asg={...STATE.asg,[k]:e.target.value};
    });
  });

  // New sol button
  document.getElementById('new-sol')?.addEventListener('click',()=>{
    STATE.req=emptyPerson(); STATE.same=true; STATE.asg=emptyPerson();
    STATE.motive=''; STATE.other=''; STATE.descripcion=''; STATE.items=[emptyItem()]; STATE.formErrors=[];
    setState({formSent:null});
  });

  // Submit form
  document.getElementById('show-summary-btn')?.addEventListener('click',()=>{ openSummary(); });
  document.getElementById('submit-form')?.addEventListener('click',async()=>{
    const errs=[];
    const r=STATE.req;
    if(!r.name) errs.push('Nombre del solicitante es requerido');
    if(!r.position) errs.push('Cargo del solicitante es requerido');
    if(!r.cedula) errs.push('Cédula del solicitante es requerida');
    if(!r.phone) errs.push('Teléfono del solicitante es requerido');
    if(!r.email||!r.email.includes('@')) errs.push('Correo válido del solicitante es requerido');
    if(!STATE.motive) errs.push('Seleccione un motivo de compra');
    if(STATE.motive==='Otros'&&!STATE.other) errs.push('Especifique el motivo');
    STATE.items.forEach((it,i)=>{ if(!it.type) errs.push(`Equipo #${i+1}: seleccione el tipo`); });
    if(errs.length){ setState({formErrors:errs}); return; }

    showLoading('Enviando solicitud...');
    try{
      const id=genId();
      const rec={
        id, createdAt:nowStr(), currentStep:1,
        requester:STATE.req,
        assignee:STATE.same?{...STATE.req}:STATE.asg,
        sameAssignee:STATE.same,
        motive:STATE.motive==='Otros'?`Otros: ${STATE.other}`:STATE.motive,
        items:STATE.items,
        history:[{step:1,label:'Solicitud recibida',date:nowStr(),note:'Solicitud creada.'}]
      };
      const all=await getSolicitudes();
      all.push(rec);
      await saveSolicitudes(all);
      const sentEmail = STATE.req.email;
      // Reset all form state completely
      STATE.req = emptyPerson();
      STATE.same = true;
      STATE.asg = emptyPerson();
      STATE.motive = '';
      STATE.other = '';
      STATE.descripcion = '';
      STATE.items = [emptyItem()];
      STATE.formErrors = [];
      setState({formSent:{id,email:sentEmail}});
      // Enviar correo de confirmación
      showLoading('Enviando confirmación por correo...');
      try {
        const emailOk = await sendConfirmationEmail(rec);
        if(emailOk){
          showToast('✓ Solicitud enviada. Revisa tu correo: '+sentEmail,'ok');
        } else {
          showToast('✓ Solicitud guardada. El correo no pudo enviarse.','info');
        }
      } catch(emailErr) {
        console.error('Error email:', emailErr);
        showToast('✓ Solicitud guardada. Revisa tu correo manualmente.','info');
      }
    }catch(e){ showToast('Error al enviar: '+e.message,'err'); }
    hideLoading();
  });

  // Track
  document.getElementById('descripcion')?.addEventListener('input',e=>{ STATE.descripcion=e.target.value; });
  document.getElementById('track-q')?.addEventListener('input',e=>{ STATE.trackQ=e.target.value; });
  document.getElementById('track-q')?.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('do-track')?.click(); });
  document.getElementById('do-track')?.addEventListener('click',async()=>{
    showLoading('Buscando...');
    try{
      const all=await getSolicitudes();
      const r=all.find(x=>x.id===STATE.trackQ.trim().toUpperCase());
      if(r){ setState({trackRec:r,trackErr:''}); }
      else { setState({trackRec:null,trackErr:'No se encontró una solicitud con ese número.'}); }
    }catch(e){ setState({trackErr:'Error al buscar: '+e.message}); }
    hideLoading();
  });

  // Login
  document.getElementById('do-login')?.addEventListener('click',function(){
    const pw = (document.getElementById('admin-pw')||{}).value||'';
    if(pw === ADMIN_PASS){
      sessionStorage.setItem('tic_adm','1');
      STATE.adminAuth = true;
      STATE.solicitudes = [];
      STATE.ordenes = {};
      document.getElementById('app').innerHTML = renderAdmin();
      attachEvents();
      // Load data after render
      getSolicitudes().then(sols=>{
        STATE.solicitudes=sols;
        getOrdenes().then(ords=>{
          STATE.ordenes=ords;
          document.getElementById('app').innerHTML = renderAdmin();
          attachEvents();
        }).catch(()=>{});
      }).catch(()=>{});
    } else {
      const err = document.getElementById('login-err');
      if(err) err.style.display='block';
    }
  });
  document.getElementById('admin-pw')?.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('do-login')?.click(); });

  // Admin search
  document.getElementById('admin-search')?.addEventListener('input',e=>setState({srch:e.target.value}));

  // Filter buttons
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.addEventListener('click',()=>setState({filter:el.dataset.filter}));
  });

  // Sol cards
  attachSolCards();

  // Detail tabs
  document.querySelectorAll('[data-dtab]').forEach(el=>{
    el.addEventListener('click',()=>{
      const tab=el.dataset.dtab;
      if(tab==='orden'){
        const oc=readOCFromDOM();
        STATE.oc=oc;
      }
      setState({detailTab:tab});
    });
  });

  // Advance
  document.getElementById('advance-note')?.addEventListener('input',e=>{ STATE.note=e.target.value; });
  document.getElementById('do-advance')?.addEventListener('click',async()=>{
    const sel_rec=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    if(!sel_rec||sel_rec.currentStep>=STEPS.length) return;
    showLoading('Avanzando...');
    try{
      const all=await getSolicitudes();
      const idx=all.findIndex(r=>r.id===STATE.selectedId); if(idx<0){hideLoading();return;}
      const next=all[idx].currentStep+1;
      const step=STEPS.find(s=>s.id===next);
      all[idx].currentStep=next;
      all[idx].history=[...(all[idx].history||[]),{step:next,label:step.label,date:nowStr(),note:STATE.note.trim()||null}];
      await saveSolicitudes(all);
      STATE.solicitudes=all;
      STATE.note='';
      setState({solicitudes:all,note:''});
      showToast('✓ Avanzado a: '+step.label,'ok');
    }catch(e){ showToast('Error: '+e.message,'err'); }
    hideLoading();
  });

  // Refresh / sync
  document.getElementById('do-refresh')?.addEventListener('click',()=>loadAdminData());
  document.getElementById('do-sync')?.addEventListener('click',async()=>{
    CACHE_SOL=null; CACHE_OC=null;
    await loadAdminData();
    showToast('✓ Datos sincronizados con la nube','ok');
  });
  document.getElementById('do-logout')?.addEventListener('click',()=>{
    sessionStorage.removeItem('tic_adm');
    setState({adminAuth:false,selectedId:null});
  });

  // OC inputs — solo guardan en STATE sin re-renderizar (evita perder foco)
  if(STATE.detailTab==='orden'){
    // Campos del header: solo guardan estado, sin render
    ['oc_numeroOrden','oc_fecha','oc_proveedor','oc_formaPago','oc_nit','oc_cotizacion',
     'oc_direccion','oc_telefono','oc_elaboradoPor','oc_cargoElabora','oc_obs'
    ].forEach(id=>{
      document.getElementById(id)?.addEventListener('input',()=>{
        STATE.oc=readOCFromDOM();
      });
    });

    // Items: solo recalculan totales visualmente sin re-renderizar todo
    STATE.oc.items.forEach((_,i)=>{
      ['oc_item_desc_','oc_item_qty_','oc_item_vu_','oc_item_iva_'].forEach(pre=>{
        document.getElementById(pre+i)?.addEventListener('input',()=>{
          STATE.oc=readOCFromDOM();
          updateOCTotals(); // solo actualiza los totales, no hace render completo
        });
      });
    });

    // Descuento: solo actualiza totales
    document.getElementById('oc_descuento')?.addEventListener('input',()=>{
      STATE.oc=readOCFromDOM();
      updateOCTotals();
    });
  }

  // ── Carpeta de Compra events ──
  attachCarpetaEvents();

    // ── Requisicion events ──
  document.getElementById('save-req')?.addEventListener('click',()=>{
    const sr=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    const n=(sr?.items||[]).reduce((s,it)=>s+(it.qty||1),0)||1;
    const req=readREQFromDOM(n);
    showLoading('Guardando...');
    const reqs=loadREQs();
    reqs[STATE.selectedId]={...req,_savedAt:nowStr()};
    saveREQs(reqs);
    hideLoading();
    showToast('✓ Requisición guardada','ok');
  });

  document.getElementById('download-req')?.addEventListener('click',()=>{
    const sr=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    const n=(sr?.items||[]).reduce((s,it)=>s+(it.qty||1),0)||1;
    const req=readREQFromDOM(n);
    generateReqPDF(req,sr);
  });

  // Save OC
  document.getElementById('save-oc')?.addEventListener('click',async()=>{
    const oc=readOCFromDOM();
    STATE.oc=oc;
    showLoading('Guardando orden en la nube...');
    try{
      const ords=await getOrdenes();
      ords[STATE.selectedId]={...oc,_savedAt:nowStr()};
      await saveOrdenes(ords);
      STATE.ordenes=ords;
      setState({ordenes:ords});
      showToast('✓ Orden de compra guardada en la nube','ok');
    }catch(e){ showToast('Error guardando: '+e.message,'err'); }
    hideLoading();
  });

  // Download OC Excel
  document.getElementById('download-oc')?.addEventListener('click',()=>{
    const oc=readOCFromDOM();
    STATE.oc=oc;
    generatePDF(oc, STATE.solicitudes.find(r=>r.id===STATE.selectedId));
  });
}

// LOAD ADMIN DATA
// ══════════════════════════════════════════════════════════════════════════════
async function loadAdminData(){
  showLoading('Cargando datos...');
  try{
    CACHE_SOL=null; CACHE_OC=null;
    const [sols,ords]=await Promise.all([getSolicitudes(),getOrdenes()]);
    setState({solicitudes:sols,ordenes:ords});
  }catch(e){ showToast('Error cargando datos: '+e.message,'err'); }
  hideLoading();
}

// EXCEL GENERATOR
// ══════════════════════════════════════════════════════════════════════════════
function generateExcel(oc, solicitud){
  if(typeof XLSX==='undefined'){ showToast('Librería Excel no cargada, intente de nuevo','err'); return; }
  const wb=XLSX.utils.book_new();
  const ws={};
  const sc=(addr,v)=>{ ws[addr]={v,t:typeof v==='number'?'n':'s'}; };

  sc('H1','GESTION TIC'); sc('AI1','CÓDIGO'); sc('AM1','GTI-FO-023');
  sc('AI2','FECHA'); sc('AM2',new Date().toLocaleDateString('es-CO'));
  sc('H3','ORDEN DE COMPRAS Y SERVICIOS (TIC)');
  sc('AI3','VERSIÓN'); sc('AM3',2);
  sc('AI4','PAGINA'); sc('AM4','1 DE 1');

  sc('B6','Numero de orden'); sc('L6',oc.numeroOrden);
  sc('Z6','Fecha');           sc('AH6',oc.fecha);
  sc('B7','Nombre del Proveedor'); sc('L7',oc.proveedor);
  sc('Z7','Forma de pago');   sc('AH7',oc.formaPago);
  sc('B8','NIT/ C.C');        sc('L8',oc.nit);
  sc('Z8','Nº Cotización');   sc('AH8',oc.cotizacion);
  sc('B9','Dirección');       sc('L9',oc.direccion);
  sc('Z9','Teléfono');        sc('AH9',oc.telefono);

  sc('A11','Item'); sc('D11','Descripción'); sc('Q11','Cantidad');
  sc('T11','Valor Unitario'); sc('Y11','Vr. Total Sin IVA');
  sc('AD11','% IVA'); sc('AG11','Vr. Total IVA'); sc('AL11','Total');

  oc.items.forEach((it,i)=>{
    const row=12+i;
    const q=parseFloat(it.cantidad)||0,vu=parseFloat(it.valorUnitario)||0,iv=(parseFloat(it.iva)||19)/100;
    const sinIva=q*vu,totIva=sinIva*iv,tot=sinIva+totIva;
    ws['A'+row]={v:i+1,t:'n'};
    ws['D'+row]={v:it.descripcion||'',t:'s'};
    ws['Q'+row]={v:q,t:'n'};
    ws['T'+row]={v:vu,t:'n',z:'#,##0'};
    ws['Y'+row]={v:sinIva,t:'n',z:'#,##0'};
    ws['AD'+row]={v:iv,t:'n',z:'0%'};
    ws['AG'+row]={v:totIva,t:'n',z:'#,##0'};
    ws['AL'+row]={v:tot,t:'n',z:'#,##0'};
  });

  const sub=oc.items.reduce((s,it)=>(parseFloat(it.cantidad)||0)*(parseFloat(it.valorUnitario)||0)+s,0);
  const tIva=oc.items.reduce((s,it)=>{const q=parseFloat(it.cantidad)||0,vv=parseFloat(it.valorUnitario)||0,iv=(parseFloat(it.iva)||19)/100;return s+q*vv*iv;},0);
  const desc=parseFloat(oc.descuento)||0, total=sub+tIva-desc;

  sc('AG60','Subtotal'); ws['AL60']={v:sub,t:'n',z:'#,##0'};
  sc('AG61','IVA');      ws['AL61']={v:tIva,t:'n',z:'#,##0'};
  sc('AG62','Descuento');ws['AL62']={v:desc,t:'n',z:'#,##0'};
  sc('AG63','Total');    ws['AL63']={v:total,t:'n',z:'#,##0'};
  sc('A60','Observaciones'); sc('A61',oc.observaciones||'');
  sc('C69','Elaboró: '+(oc.elaboradoPor||'')); sc('C70','Cargo: '+(oc.cargoElabora||''));
  sc('P69','Revisó: Carlos Andrés Peña Molina'); sc('P70','Cargo: Director TIC');
  sc('AD69','VoBo:'); sc('AD70','Cargo: Gerente');

  ws['!ref']='A1:AP74';
  ws['!cols']=Array.from({length:42},(_,i)=>({wch:i<3?8:i<15?12:8}));

  XLSX.utils.book_append_sheet(wb,ws,'GTI-FO-023');
  const fname=`OC_${oc.numeroOrden||solicitud?.id||'orden'}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.xlsx`;
  XLSX.writeFile(wb,fname);
  showToast('✓ Excel descargado: '+fname,'ok');
}

async function sendConfirmationEmail(rec) {
  try {
    const equipos = (rec.items||[]).map(it=>`• ${it.qty}x ${it.type}`).join('\n');
    const templateParams = {
      email_destino: rec.requester.email,
      email:         rec.requester.email,
      name:          rec.requester.name,
      nombre:        rec.requester.name,
      sol_id:        rec.id,
      fecha:         rec.createdAt,
      motivo:        rec.motive,
      equipos:       equipos,
      link:          'https://yefersonhardwareitm.github.io/solicitudes-compra-tic/?buscar='+rec.id,
      descripcion:   rec.descripcion||'',
      mensaje:       'Número de solicitud: '+rec.id
    };
    console.log('Enviando email a:', rec.requester.email);
    const response = await emailjs.send('service_affdkj9', 'template_glx7cwj', templateParams);
    console.log('Email enviado OK:', response.status, response.text);
    console.log('Email enviado a:', rec.requester.email);
    return true;
  } catch(e) {
    console.error('Error enviando email:', e);
    return false;
  }
}

function buildSummaryHTML(){
  const r  = STATE.req;
  const a  = STATE.asg;
  const items = STATE.items;
  const motive = STATE.motive==='Otros'?`Otros: ${STATE.other}`:STATE.motive;

  function row(label, val){
    if(!val) return '';
    return `<div class="sum-row"><span class="sum-label">${label}</span><span class="sum-val">${escH(val)}</span></div>`;
  }

  const solicitanteSection = `
    <div class="sum-section">
      <p class="sum-section-title">👤 Datos del Solicitante</p>
      ${row('Nombre', r.name)}
      ${row('Cargo', r.position)}
      ${row('Cédula', r.cedula)}
      ${row('Teléfono', r.phone)}
      ${row('Correo', r.email)}
      ${row('Empresa', r.company)}
      ${row('Área', r.area)}
    </div>`;

  const assigneeSection = STATE.same ? `
    <div class="sum-section">
      <p class="sum-section-title">📦 Asignación del Equipo</p>
      <div class="sum-row"><span class="sum-label">Receptor</span>
        <span class="sum-val" style="color:var(--success)">✓ Mismo solicitante</span></div>
    </div>` : `
    <div class="sum-section">
      <p class="sum-section-title">📦 Receptor del Equipo</p>
      ${row('Nombre', a.name)}
      ${row('Cargo', a.position)}
      ${row('Cédula', a.cedula)}
      ${row('Teléfono', a.phone)}
      ${row('Correo', a.email)}
      ${row('Empresa', a.company)}
      ${row('Área', a.area)}
    </div>`;

  const motiveSection = `
    <div class="sum-section">
      <p class="sum-section-title">🎯 Motivo de Compra</p>
      <div class="sum-row"><span class="sum-label">Motivo</span><span class="sum-val">${escH(motive)}</span></div>
      ${STATE.descripcion?`<div class="sum-row"><span class="sum-label">Descripción</span><span class="sum-val">${escH(STATE.descripcion)}</span></div>`:''}
    </div>`;

  const equipSection = `
    <div class="sum-section">
      <p class="sum-section-title">💻 Equipos Solicitados</p>
      ${items.map((it,i)=>`
        <div class="sum-equip-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${it.qty>1?6:0}px">
            <span style="font-weight:600;font-size:14px">${escH(it.type)}</span>
            <span style="background:var(--accent);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px">${it.qty}×</span>
          </div>
          ${it.qty>1?it.assignees.slice(1).map((a,j)=>`
            <p style="font-size:12px;color:var(--muted);margin:2px 0">Unidad ${j+2}: ${escH(a.name||'—')} · ${escH(a.cedula||'—')}</p>
          `).join(''):''}
        </div>`).join('')}
    </div>`;

  return solicitanteSection + assigneeSection + motiveSection + equipSection;
}

function openSummary(){
  // Validate first
  const errs=[];
  const r=STATE.req;
  if(!r.name)    errs.push('Nombre del solicitante es requerido');
  if(!r.position)errs.push('Cargo del solicitante es requerido');
  if(!r.cedula)  errs.push('Cédula del solicitante es requerida');
  if(!r.phone)   errs.push('Teléfono del solicitante es requerido');
  if(!r.email||!r.email.includes('@')) errs.push('Correo válido del solicitante es requerido');
  if(!r.company) errs.push('Nombre de la empresa es requerido');
  if(!r.area)    errs.push('Área a la que pertenece es requerida');
  if(!STATE.motive) errs.push('Seleccione un motivo de compra');
  if(STATE.motive==='Otros'&&!STATE.other) errs.push('Especifique el motivo');
  STATE.items.forEach((it,i)=>{ if(!it.type) errs.push(`Equipo #${i+1}: seleccione el tipo`); });

  if(errs.length){ setState({formErrors:errs}); return; }
  setState({formErrors:[]});

  // Build summary
  document.getElementById('summary-content').innerHTML = buildSummaryHTML();
  const modal = document.getElementById('summary-modal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeSummary(){
  document.getElementById('summary-modal').style.display = 'none';
  document.body.style.overflow = '';
}

async function confirmAndSubmit(){
  const btn = document.getElementById('confirm-send-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';
  closeSummary();

  showLoading('Guardando solicitud...');
  try{
    const id = genId();
    const rec = {
      id, createdAt:nowStr(), currentStep:1,
      requester:STATE.req,
      assignee:STATE.same?{...STATE.req}:STATE.asg,
      sameAssignee:STATE.same,
      motive:STATE.motive==='Otros'?`Otros: ${STATE.other}`:STATE.motive,
      descripcion:STATE.descripcion||'',
      items:STATE.items,
      history:[{step:1,label:'Solicitud recibida',date:nowStr(),note:'Solicitud creada.'}]
    };
    const all = await getSolicitudes();
    all.push(rec);
    await saveSolicitudes(all);
    const sentEmail = STATE.req.email;
    STATE.req=emptyPerson(); STATE.same=true; STATE.asg=emptyPerson();
    STATE.motive=''; STATE.other=''; STATE.descripcion=''; STATE.items=[emptyItem()]; STATE.formErrors=[];
    setState({formSent:{id,email:sentEmail}});
    showLoading('Enviando confirmación por correo...');
    try{
      const emailOk = await sendConfirmationEmail(rec);
      if(emailOk){ showToast('✓ Solicitud enviada. Revisa tu correo: '+sentEmail,'ok'); }
      else { showToast('✓ Solicitud guardada. El correo no pudo enviarse.','info'); }
    }catch(emailErr){
      console.error('Error email:', emailErr);
      showToast('✓ Solicitud guardada. Revisa tu correo manualmente.','info');
    }
  }catch(e){ showToast('Error al enviar: '+e.message,'err'); }
  hideLoading();
  btn.disabled = false;
  btn.textContent = '✅ Confirmar y Enviar';
}

// ── CANCEL FUNCTIONS ──────────────────────────────────────────
let _cancelId = null;
function openCancel(id){
  _cancelId = id;
  document.getElementById('cancel-reason').value='';
  const m=document.getElementById('cancel-modal');
  m.style.display='flex';
}
function closeCancel(){
  document.getElementById('cancel-modal').style.display='none';
  _cancelId=null;
}
async function confirmCancel(){
  const reason=document.getElementById('cancel-reason').value.trim();
  if(!reason){ showToast('Por favor indica el motivo de cancelación','err'); return; }
  showLoading('Cancelando solicitud...');
  try{
    const all=await getSolicitudes();
    const idx=all.findIndex(r=>r.id===_cancelId);
    if(idx<0){ hideLoading(); showToast('Solicitud no encontrada','err'); return; }
    all[idx].cancelled=true;
    all[idx].cancelReason=reason;
    all[idx].cancelledAt=nowStr();
    all[idx].history=[...(all[idx].history||[]),
      {step:all[idx].currentStep,label:'🚫 Solicitud cancelada',date:nowStr(),note:'Motivo: '+reason}];
    await saveSolicitudes(all);
    CACHE_SOL=all; CACHE_SOL_TS=Date.now();
    closeCancel();
    // Refresh track view
    STATE.trackRec=all[idx];
    setState({trackRec:all[idx]});
    showToast('✓ Solicitud cancelada correctamente','ok');
  }catch(e){ showToast('Error: '+e.message,'err'); }
  hideLoading();
}

async function boot(){
  // Auto-buscar si viene desde link del correo
  const urlParams = new URLSearchParams(window.location.search);
  const buscarId = urlParams.get('buscar');
  if(buscarId && STATE.mode==='public'){
    STATE.publicTab = 'track';
    STATE.trackQ = buscarId.toUpperCase();
  }
  showLoading('Conectando con la base de datos...');
  try{
    await initBins();
    hideLoading();
    if(STATE.mode==='admin' && STATE.adminAuth){
      await loadAdminData();
    } else {
      render();
      // Auto-ejecutar búsqueda si viene del link del correo
      const urlParams = new URLSearchParams(window.location.search);
      const buscarId = urlParams.get('buscar');
      if(buscarId && STATE.mode==='public'){
        setTimeout(async()=>{
          const all = await getSolicitudes();
          const r = all.find(x=>x.id===buscarId.toUpperCase());
          if(r){ setState({trackRec:r, trackErr:''}); }
          else { setState({trackErr:'No se encontró la solicitud '+buscarId}); }
        }, 500);
      }
    }
  }catch(e){
    hideLoading();
    console.error('Boot error:', e);
    // Still render the app, just without cloud data
    render();
    showToast('⚠ Sin conexión a la nube: '+e.message, 'err');
  }
}


function updateOCTotals(){
  const oc = readOCFromDOM();
  STATE.oc = oc;
  const items = oc.items||[];
  let subtotal=0, totalIva=0;
  items.forEach(it=>{
    const q=parseFloat(it.cantidad||0), vu=parseFloat(it.valorUnitario||0), iv=(parseFloat(it.iva||19))/100;
    subtotal += q*vu;
    totalIva += q*vu*iv;
  });
  const desc = parseFloat(oc.descuento||0);
  const total = subtotal+totalIva-desc;

  function fmtCOP(v){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0}).format(v||0); }

  // Update computed cells (read-only display cells)
  oc.items.forEach((it,i)=>{
    const q=parseFloat(it.cantidad||0), vu=parseFloat(it.valorUnitario||0), iv=(parseFloat(it.iva||19))/100;
    const sin=q*vu, tiva=sin*iv, tot=sin+tiva;
    const sinEl=document.getElementById('oc_calc_sin_'+i);
    const tivaEl=document.getElementById('oc_calc_tiva_'+i);
    const totEl=document.getElementById('oc_calc_tot_'+i);
    if(sinEl) sinEl.textContent = sin>0?fmtCOP(sin):'—';
    if(tivaEl) tivaEl.textContent = tiva>0?fmtCOP(tiva):'—';
    if(totEl) totEl.textContent = tot>0?fmtCOP(tot):'—';
  });

  // Update summary totals
  const subEl=document.getElementById('oc_total_subtotal');
  const ivaEl=document.getElementById('oc_total_iva');
  const totEl=document.getElementById('oc_total_total');
  if(subEl) subEl.textContent=fmtCOP(subtotal);
  if(ivaEl) ivaEl.textContent=fmtCOP(totalIva);
  if(totEl) totEl.textContent=fmtCOP(total);
}

function generatePDF(oc, solicitud) {
  if(typeof window.jspdf === 'undefined' && typeof jsPDF === 'undefined') {
    showToast('Librería PDF no cargada, reintente','err'); return;
  }
  const { jsPDF } = window.jspdf || window;
  const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });

  // A4 portrait in points: 595 x 842
  const PW = 595.28, PH = 841.89;
  const ML = 40, MR = 40, MT = 34, MB = 34;
  const CW = PW - ML - MR;

  const RED   = [192,0,0];
  const WHITE = [255,255,255];
  const BLACK = [0,0,0];
  const GRAY  = [242,242,242];

  function fmtC(v) {
    try { return '$ ' + parseFloat(v||0).toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:0}); }
    catch { return '$ 0'; }
  }

  function fr(x,y,w,h,fill) {
    doc.setFillColor(...fill); doc.setDrawColor(...BLACK);
    doc.setLineWidth(0.6); doc.rect(x,y,w,h,'FD');
  }
  function er(x,y,w,h) {
    doc.setFillColor(...WHITE); doc.setDrawColor(...BLACK);
    doc.setLineWidth(0.6); doc.rect(x,y,w,h,'FD');
  }
  function cell(x,y,w,h,s,sz,bold,col,align) {
    // Vertically centered text inside a cell
    doc.setFontSize(sz||8);
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.setTextColor(...(col||BLACK));
    const ty = y + h/2 + (sz||8)*0.35;
    const pad = 4;
    if(align==='center') doc.text(String(s||''), x+w/2, ty, {align:'center'});
    else if(align==='right') doc.text(String(s||''), x+w-pad, ty, {align:'right'});
    else doc.text(String(s||''), x+pad, ty, {align:'left'});
  }

  let Y = MT;

  // ── HEADER ────────────────────────────────────────────────────
  const HH=91, lw=102, iw=148, cw2=CW-lw-iw, HY=Y;

  doc.setDrawColor(...BLACK); doc.setLineWidth(1.0);

    }
    let x2=ML;
    row.forEach((val,j)=>{
      doc.setFillColor(...bg); doc.setDrawColor(...BLACK); doc.setLineWidth(0.4);
      doc.rect(x2,Y,C[j],IH,'FD');
      cell(x2,Y,C[j],IH,val,6.5,false,BLACK,ALN[j]);
      x2+=C[j];
    });
    Y+=IH;
  }

  // ── OBSERVACIONES + TOTALES ────────────────────────────────────
  const OH=46;
  const tw=C[5]+C[6]+C[7], ow=CW-tw;
  const desc=parseFloat(oc.descuento||0);
  const totalF=sub+tivaSum-desc;

  const olw=ow*0.32, ovw=ow-olw;
  fr(ML,Y,olw,OH,RED);
  cell(ML,Y,olw,OH,'Observaciones',7.5,true,WHITE,'left');
  er(ML+olw,Y,ovw,OH);
  // obs text with wrapping
  const obsText=String(oc.observaciones||'-');
  doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(...BLACK);
  const obsLines=doc.splitTextToSize(obsText, ovw-8);
  doc.text(obsLines.slice(0,3), ML+olw+4, Y+OH/2-3);

  const tx=ML+ow, trh=OH/4, tlw=tw*0.48, tvw=tw-tlw;
  [['Subtotal',fmtC(sub)],['IVA',fmtC(tivaSum)],
   ['Descuento',desc?fmtC(desc):''],['Total',fmtC(totalF)]
  ].forEach(([lbl,val],i)=>{
    const ry=Y+i*trh;
    fr(tx,ry,tlw,trh,RED); cell(tx,ry,tlw,trh,lbl,7,true,WHITE,'right');
    er(tx+tlw,ry,tvw,trh); cell(tx+tlw,ry,tvw,trh,val,7,false,BLACK,'right');
  });
  Y+=OH;

  // ── FIRMAS — justo debajo de observaciones ─────────────────────
  Y+=11;
  const SH=62, sw=CW/3;
  doc.setDrawColor(...BLACK); doc.setLineWidth(0.6);
  doc.rect(ML,Y,CW,SH);

  const sigs=[
    [('Elaboró: '+(oc.elaboradoPor||'')), ('Cargo: '+(oc.cargoElabora||''))],
    ['Revisó: Carlos Andrés Peña Molina','Cargo: Director TIC'],
    ['VoBo:','Cargo: Gerente'],
  ];
  sigs.forEach(([l1,l2],i)=>{
    const sx=ML+i*sw;
    if(i>0){ doc.setDrawColor(...BLACK); doc.line(sx,Y,sx,Y+SH); }
    const ly=Y+SH*0.60;
    doc.setDrawColor(...BLACK); doc.setLineWidth(0.4);
    doc.line(sx+10,ly,sx+sw-10,ly);
    doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...BLACK);
    doc.text(l1, sx+sw/2, ly+11, {align:'center'});
    doc.text(l2, sx+sw/2, ly+20, {align:'center'});
  });

  const fname=`OC_${oc.numeroOrden||solicitud?.id||'orden'}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.pdf`;
  doc.save(fname);
  showToast('✓ PDF descargado: '+fname,'ok');
}

// Auto-refresh disabled

boot();
</script>
