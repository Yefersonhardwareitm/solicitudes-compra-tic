<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SolicitudTIC — Dpto. de Tecnología</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f14;--surface:#141920;--surface2:#1a2130;--border:#252d3a;
  --accent:#3b9eff;--success:#34c77b;--warning:#f0a429;--danger:#f05252;
  --text:#e2eaf4;--muted:#6b7a94;--radius:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,select,textarea{font-family:'DM Sans',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .32s ease both}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}

/* ── Layout ── */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:62px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-icon{width:30px;height:30px;background:var(--accent);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.nav-title{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;line-height:1}
.nav-sub{font-size:10px;color:var(--muted);margin-top:1px}
.nav-tabs{display:flex;gap:4px;flex-wrap:wrap}
.nav-tab{padding:7px 15px;background:transparent;border:none;border-radius:8px;
  color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.nav-tab.active{background:var(--accent);color:#fff}

/* ── Components ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;
  letter-spacing:.4px;text-transform:uppercase}
.field .req{color:var(--accent);margin-left:3px}
.field .hint{font-size:11px;color:var(--muted);margin-top:3px}
.inp,.sel,.ta{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif}
.sel{cursor:pointer}
.ta{resize:vertical}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent)}
.btn{padding:11px 22px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:14px;cursor:pointer;transition:opacity .18s,transform .1s;color:#fff}
.btn:hover{opacity:.8;transform:translateY(-1px)}
.btn-primary{background:var(--accent)}
.btn-success{background:var(--success)}
.btn-danger{background:var(--danger)}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-warning{background:var(--warning)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-full{width:100%}
.btn-purple{background:#7c3aed}
.divider{height:1px;background:var(--border);margin:18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.span2{grid-column:1/-1}
.page{max-width:740px;margin:0 auto;padding:34px 22px}

/* ── Admin layout ── */
.admin-wrap{display:flex;flex-direction:column;height:100vh}
.admin-header{display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:58px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;gap:12px;flex-wrap:wrap}
.admin-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:285px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:10px}
.main-area{flex:1;overflow-y:auto;padding:22px}
.sol-card{padding:11px 13px;border-radius:10px;margin-bottom:7px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);transition:all .2s}
.sol-card:hover{border-color:var(--accent)}
.sol-card.active{border-color:var(--accent);background:#3b9eff0d}
.sol-card-id{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--accent)}
.sol-card-name{font-size:13px;font-weight:500;margin-bottom:2px}
.sol-card-items{font-size:11px;color:var(--muted);margin-bottom:5px}
.sol-card-bar-wrap{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.sol-card-bar{height:100%;border-radius:2px;transition:width .3s}
.sol-card-date{font-size:10px;color:var(--muted);margin-top:4px}

/* ── Detail tabs ── */
.detail-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.detail-tab{padding:9px 18px;background:transparent;border:none;
  border-bottom:2px solid transparent;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.detail-tab.active{border-bottom-color:var(--accent);color:var(--accent)}

/* ── Progress ── */
.progress-bar-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.progress-bar-bg{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:4px;transition:width .6s}
.progress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:7px}
.progress-step{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2)}
.progress-step.done{border-color:#34c77b44;background:#34c77b0a;opacity:1}
.progress-step.active{border-color:var(--accent);background:#3b9eff0a;opacity:1}
.progress-step.pending{opacity:.45}

/* ── OC items table ── */
.oc-table{width:100%;border-collapse:collapse;font-size:13px}
.oc-table th{background:var(--surface2);padding:8px 6px;text-align:center;font-size:11px;
  font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.oc-table td{padding:4px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
.oc-table td.num{text-align:right;color:var(--muted);padding:0 8px}
.oc-table td.idx{text-align:center;color:var(--muted);font-size:12px}
.totals-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
.total-final{display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid var(--accent);margin-top:4px}

/* ── History ── */
.history-item{display:flex;gap:11px;margin-bottom:12px}
.history-dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0;margin-top:3px}
.history-line{width:1px;flex:1;background:var(--border);margin-top:3px}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;
  font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#toast.ok{background:#34c77b;color:#fff}
#toast.err{background:var(--danger);color:#fff}
#toast.info{background:var(--accent);color:#fff}

/* ── Loading overlay ── */
#loading-overlay{position:fixed;inset:0;background:#0b0f14cc;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:9998;gap:16px}
#loading-overlay p{color:var(--text);font-size:15px}

/* ── Responsive ── */
@media(max-width:700px){
  .grid2{grid-template-columns:1fr}
  .span2{grid-column:1}
  .admin-body{flex-direction:column}
  .sidebar{width:100%;max-height:220px;border-right:none;border-bottom:1px solid var(--border)}
  .main-area{padding:14px}
  nav{height:auto;padding:10px 14px}
  .oc-table{font-size:11px}
}
</style>
</head>
<body>

<div id="toast"></div>
<div id="loading-overlay" style="display:none">
  <div class="spinner" style="width:36px;height:36px;border-width:3px"></div>
  <p id="loading-msg">Cargando...</p>
</div>

<div id="app"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG — JSONBin
// ══════════════════════════════════════════════════════════════════════════════
const JSONBIN_KEY  = '$2a$10$wG6u5Kgiue9nTE6dkp5lsOpnNeUDsmMs4M/JLTybqbc21PEZVtdyu';
const JSONBIN_URL  = 'https://api.jsonbin.io/v3/b';
const BIN_IDS_KEY  = 'tic_bin_ids_v1';
const ADMIN_PASS   = 'compras2024';
// IDs fijos — todos los dispositivos usan los mismos bins
const FIXED_BIN_SOL = '69fc9ac1250b1311c318d329';
const FIXED_BIN_OC  = '69fc9ad3250b1311c318d394';

// ── Steps & Equipment ──
const STEPS = [
  {id:1,label:'Solicitud recibida',icon:'📋'},
  {id:2,label:'Solicitud de cotización',icon:'💬'},
  {id:3,label:'Orden de compra',icon:'📄'},
  {id:4,label:'Requisición de compra',icon:'📝'},
  {id:5,label:'Firma Coordinador TIC',icon:'✍️'},
  {id:6,label:'Firma Dirección TIC',icon:'✍️'},
  {id:7,label:'Firma Gerencia',icon:'✍️'},
  {id:8,label:'Aprobación al proveedor',icon:'✅'},
  {id:9,label:'Soporte de pago',icon:'💳'},
  {id:10,label:'Recepción de equipos',icon:'📦'},
  {id:11,label:'Revisión de estado',icon:'🔍'},
  {id:12,label:'Configuración',icon:'⚙️'},
  {id:13,label:'Documentación de entrega',icon:'📃'},
  {id:14,label:'Entrega de equipos',icon:'🤝'},
  {id:15,label:'Recolección de firmas',icon:'🖊️'},
  {id:16,label:'Subida a carpeta',icon:'☁️'},
];
const EQUIP = [
  'Laptop / Computadora portátil','Computadora de escritorio (PC)','Monitor',
  'Teclado','Mouse','Impresora','Escáner','Tablet','Teléfono / Smartphone',
  'Teléfono IP','Switch de red','Router / Access Point','Servidor',
  'Disco duro / Almacenamiento','UPS / Regulador','Cámara / Webcam',
  'Audífonos / Headset','Proyector','Otro',
];

// ══════════════════════════════════════════════════════════════════════════════
// JSONBIN API HELPERS
// ══════════════════════════════════════════════════════════════════════════════
let BIN_SOL = null; // bin ID for solicitudes
let BIN_OC  = null; // bin ID for ordenes de compra

function getBinIds(){
  try{ const d=JSON.parse(localStorage.getItem(BIN_IDS_KEY)); return d||{}; }catch{ return {}; }
}
function saveBinIds(d){ localStorage.setItem(BIN_IDS_KEY, JSON.stringify(d)); }

async function createBin(name, data){
  const r = await fetch(JSONBIN_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY,'X-Bin-Name':name,'X-Bin-Private':'true'},
    body: JSON.stringify(data)
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error creando bin');
  return j.metadata.id;
}

async function fetchWithTimeout(url, opts={}, ms=10000){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {...opts, signal:ctrl.signal});
    clearTimeout(timer);
    return r;
  }catch(e){
    clearTimeout(timer);
    throw new Error('Sin conexión o tiempo agotado. Verifica tu internet.');
  }
}

async function readBin(id){
  const r = await fetchWithTimeout(`${JSONBIN_URL}/${id}/latest`,{
    headers:{'X-Master-Key':JSONBIN_KEY, 'X-Bin-Meta':'false'}
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error leyendo bin');
  return j.record || j;
}

async function updateBin(id, data){
  const r = await fetchWithTimeout(`${JSONBIN_URL}/${id}`,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
    body: JSON.stringify(data)
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Error actualizando bin');
  return j.record;
}

async function initBins(){
  // Usar siempre los bins fijos — mismo dato en todos los dispositivos
  BIN_SOL = FIXED_BIN_SOL;
  BIN_OC  = FIXED_BIN_OC;
}

// ── In-memory cache to reduce API calls ──
let CACHE_SOL = null;
let CACHE_OC  = null;
let CACHE_SOL_TS = 0;
let CACHE_OC_TS  = 0;
const CACHE_TTL = 8000; // 8 seconds

async function getSolicitudes(){
  if(CACHE_SOL && Date.now()-CACHE_SOL_TS < CACHE_TTL) return [...CACHE_SOL];
  try{
    const d = await readBin(BIN_SOL);
    CACHE_SOL = d.solicitudes||d||[];
    CACHE_SOL_TS = Date.now();
  }catch(e){
    console.warn('getSolicitudes error:', e);
    if(!CACHE_SOL) CACHE_SOL = [];
  }
  return [...CACHE_SOL];
}
async function saveSolicitudes(arr){
  CACHE_SOL = arr;
  CACHE_SOL_TS = Date.now();
  await updateBin(BIN_SOL, {solicitudes:arr});
}
async function getOrdenes(){
  if(CACHE_OC && Date.now()-CACHE_OC_TS < CACHE_TTL) return {...CACHE_OC};
  try{
    const d = await readBin(BIN_OC);
    CACHE_OC = d.ordenes||{};
    CACHE_OC_TS = Date.now();
  }catch(e){
    console.warn('getOrdenes error:', e);
    if(!CACHE_OC) CACHE_OC = {};
  }
  return {...CACHE_OC};
}
async function saveOrdenes(obj){
  CACHE_OC = obj;
  CACHE_OC_TS = Date.now();
  await updateBin(BIN_OC, {ordenes:obj});
}

// ══════════════════════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════════════════════
function genId(){ return 'SOL-'+Math.random().toString(36).substr(2,7).toUpperCase(); }
function nowStr(){ return new Date().toLocaleString('es-CO'); }
function fmt$(v){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0}).format(v||0); }
function emptyPerson(){ return {name:'',position:'',cedula:'',phone:'',email:''}; }
function emptyItem(){ return {type:'',qty:1,assignees:[{name:'',cedula:''}]}; }
function emptyOC(){ return {
  numeroOrden:'',fecha:'',proveedor:'',formaPago:'',nit:'',cotizacion:'',
  direccion:'',telefono:'',elaboradoPor:'',cargoElabora:'',observaciones:'',descuento:0,
  items:Array.from({length:10},()=>({descripcion:'',cantidad:'',valorUnitario:'',iva:19}))
};}

function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  setTimeout(()=>t.className='',3000);
}
function showLoading(msg='Guardando...'){ document.getElementById('loading-overlay').style.display='flex'; document.getElementById('loading-msg').textContent=msg; }
function hideLoading(){ document.getElementById('loading-overlay').style.display='none'; }

// ══════════════════════════════════════════════════════════════════════════════
// APP STATE
// ══════════════════════════════════════════════════════════════════════════════
const STATE = {
  mode: new URLSearchParams(window.location.search).get('modo')==='compras'?'admin':'public',
  publicTab: 'form',
  adminAuth: sessionStorage.getItem('tic_adm')==='1',
  adminTab: 'gestion',
  detailTab: 'gestion',
  selectedId: null,
  filter: 'all',
  srch: '',
  solicitudes: [],
  ordenes: {},
  note: '',
  adminPw: '',
  // Form state
  req: emptyPerson(),
  same: true,
  asg: emptyPerson(),
  motive: '',
  other: '',
  items: [emptyItem()],
  formErrors: [],
  formSent: null,
  // Track state
  trackQ: '',
  trackRec: null,
  trackErr: '',
  // OC state
  oc: emptyOC(),
  ocLoaded: false,
};

let renderPending = false;
function setState(patch){
  Object.assign(STATE, patch);
  if(!renderPending){
    renderPending=true;
    requestAnimationFrame(()=>{ renderPending=false; render(); });
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// HTML BUILDERS
// ══════════════════════════════════════════════════════════════════════════════
function h(tag, attrs='', ...children){
  return `<${tag} ${attrs}>${children.join('')}</${tag}>`;
}
function inp(id,val,ph='',type='text',extra=''){
  return `<input class="inp" id="${id}" type="${type}" value="${escH(val)}" placeholder="${escH(ph)}" ${extra}/>`;
}
function sel(id,val,opts,ph='-- Seleccionar --'){
  const options=[`<option value="">${ph}</option>`,...opts.map(o=>`<option value="${escH(o)}" ${val===o?'selected':''}>${escH(o)}</option>`)];
  return `<select class="sel" id="${id}">${options.join('')}</select>`;
}
function ta(id,val,ph=''){
  return `<textarea class="ta" id="${id}" rows="3" placeholder="${escH(ph)}">${escH(val)}</textarea>`;
}
function btn(label,cls,id='',style=''){
  return `<button class="btn ${cls}" id="${id}" style="${style}">${label}</button>`;
}
function field(label,req,content,hint=''){
  return `<div class="field"><label>${escH(label)}${req?'<span class="req">*</span>':''}</label>${content}${hint?`<p class="hint">${hint}</p>`:''}</div>`;
}
function badge(label,color){
  return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}</span>`;
}
function card(content,style=''){
  return `<div class="card" style="${style}">${content}</div>`;
}
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ══════════════════════════════════════════════════════════════════════════════
// COMPONENTS
// ══════════════════════════════════════════════════════════════════════════════
function personBlock(prefix,data){
  return `
    <div class="grid2">
      ${field('Nombre completo',true,inp(prefix+'_name',data.name,'Nombre y apellido'))}
      ${field('Cargo',true,inp(prefix+'_position',data.position,'Cargo que ocupa'))}
      ${field('Cédula',true,inp(prefix+'_cedula',data.cedula,'V-00000000'))}
      ${field('Teléfono',true,inp(prefix+'_phone',data.phone,'0414-0000000'))}
      <div class="field span2"><label>Correo electrónico<span class="req">*</span></label>
        <input class="inp" id="${prefix}_email" type="email" value="${escH(data.email)}" placeholder="correo@ejemplo.com" style="width:100%"/>
      </div>
    </div>`;
}

function itemsBlock(items){
  return items.map((it,i)=>`
    <div class="card" style="margin-bottom:12px;background:var(--surface2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px">Equipo #${i+1}</span>
        ${items.length>1?btn('✕ Quitar','btn btn-danger btn-sm','rem-item-'+i):''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 100px;gap:0 12px">
        ${field('Tipo de equipo',true,sel('item_type_'+i,it.type,EQUIP,'-- Seleccionar --'))}
        ${field('Cantidad',true,`<input class="inp" id="item_qty_${i}" type="number" min="1" max="20" value="${it.qty}"/>`)}
      </div>
      ${it.qty>1?`<div style="margin-top:4px">
        <p style="font-size:12px;color:var(--muted);margin-bottom:8px">¿A quién se asigna cada unidad?</p>
        ${it.assignees.map((a,j)=>`
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px;background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:8px">
            ${field('Unidad '+(j+1)+' — Nombre',false,inp(`asg_${i}_${j}_name`,a.name,'Nombre'))}
            ${field('Cédula',false,inp(`asg_${i}_${j}_cedula`,a.cedula,'V-00000000'))}
          </div>`).join('')}
      </div>`:''}
    </div>`).join('');
}

function progressTracker(currentStep){
  const pct=Math.round((currentStep/STEPS.length)*100);
  return `
    <div class="progress-bar-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <span style="font-size:13px;font-weight:700;color:${pct===100?'var(--success)':'var(--accent)'};white-space:nowrap">
        ${pct===100?'✓ Completado':pct+'% completado'}
      </span>
    </div>
    <div class="progress-grid">
      ${STEPS.map(s=>{
        const done=s.id<currentStep,active=s.id===currentStep,pending=s.id>currentStep;
        return `<div class="progress-step ${done?'done':active?'active':'pending'}">
          <span style="font-size:15px">${s.icon}</span>
          <div>
            <p style="font-size:10px;font-weight:600;letter-spacing:.3px;color:${done?'var(--success)':active?'var(--accent)':'var(--muted)'}">
              ${done?'✓ Listo':active?'● En curso':'Pendiente'}
            </p>
            <p style="font-size:12px;font-weight:500">${s.label}</p>
          </div>
        </div>`;
      }).join('')}
    </div>`;

function readOCFromDOM(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const items=STATE.oc.items.map((_,i)=>({
    descripcion:g('oc_item_desc_'+i),
    cantidad:g('oc_item_qty_'+i),
    valorUnitario:g('oc_item_vu_'+i),
    iva:g('oc_item_iva_'+i)||19
  }));
  return {
    numeroOrden:g('oc_numeroOrden'),fecha:g('oc_fecha'),proveedor:g('oc_proveedor'),
    formaPago:g('oc_formaPago'),nit:g('oc_nit'),cotizacion:g('oc_cotizacion'),
    direccion:g('oc_direccion'),telefono:g('oc_telefono'),
    elaboradoPor:g('oc_elaboradoPor'),cargoElabora:g('oc_cargoElabora'),
    observaciones:g('oc_obs'),descuento:g('oc_descuento')||0,items
  };
}

function attachEvents(){
  // ── Public tabs ──
  document.getElementById('tab-form')?.addEventListener('click',()=>setState({publicTab:'form',formSent:null}));
  document.getElementById('tab-track')?.addEventListener('click',()=>setState({publicTab:'track'}));

  // ── Form ──
  document.getElementById('same-check')?.addEventListener('change',e=>setState({same:e.target.checked}));
  document.getElementById('motive')?.addEventListener('change',e=>setState({motive:e.target.value}));
  document.getElementById('other-motive')?.addEventListener('input',e=>setState({other:e.target.value}));
  document.getElementById('add-item')?.addEventListener('click',()=>{
    setState({items:[...STATE.items,emptyItem()]});
  });
  // Remove item
  document.querySelectorAll('[id^="rem-item-"]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.id.replace('rem-item-',''));
      setState({items:STATE.items.filter((_,j)=>j!==i)});
    });
  });
  // Item type/qty change
  STATE.items.forEach((_,i)=>{
    document.getElementById('item_type_'+i)?.addEventListener('change',e=>{
      const items=[...STATE.items]; items[i]={...items[i],type:e.target.value}; setState({items});
    });
    document.getElementById('item_qty_'+i)?.addEventListener('change',e=>{
      const qty=Math.max(1,parseInt(e.target.value)||1);
      const items=[...STATE.items];
      const cur=items[i].assignees;
      items[i]={...items[i],qty,assignees:Array.from({length:qty},(_,j)=>cur[j]||{name:'',cedula:''})};
      setState({items});
    });
    // Assignee fields
    STATE.items[i]?.assignees?.forEach((_,j)=>{
      document.getElementById(`asg_${i}_${j}_name`)?.addEventListener('input',e=>{
        const items=[...STATE.items]; const a=[...items[i].assignees]; a[j]={...a[j],name:e.target.value};
        items[i]={...items[i],assignees:a}; STATE.items=items;
      });
      document.getElementById(`asg_${i}_${j}_cedula`)?.addEventListener('input',e=>{
        const items=[...STATE.items]; const a=[...items[i].assignees]; a[j]={...a[j],cedula:e.target.value};
        items[i]={...items[i],assignees:a}; STATE.items=items;
      });
    });
  });

  // Person fields
  ['req_name','req_position','req_cedula','req_phone','req_email'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',e=>{
      const k=id.replace('req_',''); STATE.req={...STATE.req,[k]:e.target.value};
    });
  });
  ['asg_name','asg_position','asg_cedula','asg_phone','asg_email'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',e=>{
      const k=id.replace('asg_',''); STATE.asg={...STATE.asg,[k]:e.target.value};
    });
  });

  // New sol button
  document.getElementById('new-sol')?.addEventListener('click',()=>setState({
    formSent:null,formErrors:[],req:emptyPerson(),same:true,asg:emptyPerson(),
    motive:'',other:'',items:[emptyItem()]
  }));

  // Submit form
  document.getElementById('submit-form')?.addEventListener('click',async()=>{
    const errs=[];
    const r=STATE.req;
    if(!r.name) errs.push('Nombre del solicitante es requerido');
    if(!r.position) errs.push('Cargo del solicitante es requerido');
    if(!r.cedula) errs.push('Cédula del solicitante es requerida');
    if(!r.phone) errs.push('Teléfono del solicitante es requerido');
    if(!r.email||!r.email.includes('@')) errs.push('Correo válido del solicitante es requerido');
    if(!STATE.motive) errs.push('Seleccione un motivo de compra');
    if(STATE.motive==='Otros'&&!STATE.other) errs.push('Especifique el motivo');
    STATE.items.forEach((it,i)=>{ if(!it.type) errs.push(`Equipo #${i+1}: seleccione el tipo`); });
    if(errs.length){ setState({formErrors:errs}); return; }

    showLoading('Enviando solicitud...');
    try{
      const id=genId();
      const rec={
        id, createdAt:nowStr(), currentStep:1,
        requester:STATE.req,
        assignee:STATE.same?{...STATE.req}:STATE.asg,
        sameAssignee:STATE.same,
        motive:STATE.motive==='Otros'?`Otros: ${STATE.other}`:STATE.motive,
        items:STATE.items,
        history:[{step:1,label:'Solicitud recibida',date:nowStr(),note:'Solicitud creada.'}]
      };
      const all=await getSolicitudes();
      all.push(rec);
      await saveSolicitudes(all);
      setState({formSent:{id,email:STATE.req.email},formErrors:[]});
      showToast('✓ Solicitud enviada correctamente','ok');
    }catch(e){ showToast('Error al enviar: '+e.message,'err'); }
    hideLoading();
  });

  // Track
  document.getElementById('track-q')?.addEventListener('input',e=>{ STATE.trackQ=e.target.value; });
  document.getElementById('track-q')?.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('do-track')?.click(); });
  document.getElementById('do-track')?.addEventListener('click',async()=>{
    showLoading('Buscando...');
    try{
      const all=await getSolicitudes();
      const r=all.find(x=>x.id===STATE.trackQ.trim().toUpperCase());
      if(r){ setState({trackRec:r,trackErr:''}); }
      else { setState({trackRec:null,trackErr:'No se encontró una solicitud con ese número.'}); }
    }catch(e){ setState({trackErr:'Error al buscar: '+e.message}); }
    hideLoading();
  });

  // Login
  document.getElementById('do-login')?.addEventListener('click',()=>{
    const pw=document.getElementById('admin-pw')?.value||'';
    if(pw===ADMIN_PASS){
      sessionStorage.setItem('tic_adm','1');
      setState({adminAuth:true});
      loadAdminData();
    } else {
      document.getElementById('login-err').style.display='block';
    }
  });
  document.getElementById('admin-pw')?.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('do-login')?.click(); });

  // Admin search
  document.getElementById('admin-search')?.addEventListener('input',e=>setState({srch:e.target.value}));

  // Filter buttons
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.addEventListener('click',()=>setState({filter:el.dataset.filter}));
  });

  // Sol cards
  document.querySelectorAll('.sol-card[data-id]').forEach(el=>{
    el.addEventListener('click',async()=>{
      const id=el.dataset.id;
      const oc = STATE.ordenes[id]||emptyOC();
      setState({selectedId:id,detailTab:'gestion',oc});
    });
  });

  // Detail tabs
  document.querySelectorAll('[data-dtab]').forEach(el=>{
    el.addEventListener('click',()=>{
      const tab=el.dataset.dtab;
      if(tab==='orden'){
        const oc=readOCFromDOM();
        STATE.oc=oc;
      }
      setState({detailTab:tab});
    });
  });

  // Advance
  document.getElementById('advance-note')?.addEventListener('input',e=>{ STATE.note=e.target.value; });
  document.getElementById('do-advance')?.addEventListener('click',async()=>{
    const sel_rec=STATE.solicitudes.find(r=>r.id===STATE.selectedId);
    if(!sel_rec||sel_rec.currentStep>=STEPS.length) return;
    showLoading('Avanzando...');
    try{
      const all=await getSolicitudes();
      const idx=all.findIndex(r=>r.id===STATE.selectedId); if(idx<0){hideLoading();return;}
      const next=all[idx].currentStep+1;
      const step=STEPS.find(s=>s.id===next);
      all[idx].currentStep=next;
      all[idx].history=[...(all[idx].history||[]),{step:next,label:step.label,date:nowStr(),note:STATE.note.trim()||null}];
      await saveSolicitudes(all);
      STATE.solicitudes=all;
      STATE.note='';
      setState({solicitudes:all,note:''});
      showToast('✓ Avanzado a: '+step.label,'ok');
    }catch(e){ showToast('Error: '+e.message,'err'); }
    hideLoading();
  });

  // Refresh / sync
  document.getElementById('do-refresh')?.addEventListener('click',()=>loadAdminData());
  document.getElementById('do-sync')?.addEventListener('click',async()=>{
    CACHE_SOL=null; CACHE_OC=null;
    await loadAdminData();
    showToast('✓ Datos sincronizados con la nube','ok');
  });
  document.getElementById('do-logout')?.addEventListener('click',()=>{
    sessionStorage.removeItem('tic_adm');
    setState({adminAuth:false,selectedId:null});
  });

  // OC inputs — solo guardan en STATE sin re-renderizar (evita perder foco)
  if(STATE.detailTab==='orden'){
    // Campos del header: solo guardan estado, sin render
    ['oc_numeroOrden','oc_fecha','oc_proveedor','oc_formaPago','oc_nit','oc_cotizacion',
     'oc_direccion','oc_telefono','oc_elaboradoPor','oc_cargoElabora','oc_obs'
    ].forEach(id=>{
      document.getElementById(id)?.addEventListener('input',()=>{
        STATE.oc=readOCFromDOM();
      });
    });

    // Items: solo recalculan totales visualmente sin re-renderizar todo
    STATE.oc.items.forEach((_,i)=>{
      ['oc_item_desc_','oc_item_qty_','oc_item_vu_','oc_item_iva_'].forEach(pre=>{
        document.getElementById(pre+i)?.addEventListener('input',()=>{
          STATE.oc=readOCFromDOM();
          updateOCTotals(); // solo actualiza los totales, no hace render completo
        });
      });
    });

    // Descuento: solo actualiza totales
    document.getElementById('oc_descuento')?.addEventListener('input',()=>{
      STATE.oc=readOCFromDOM();
      updateOCTotals();
    });
  }

  // Save OC
  document.getElementById('save-oc')?.addEventListener('click',async()=>{
    const oc=readOCFromDOM();
    STATE.oc=oc;
    showLoading('Guardando orden en la nube...');
    try{
      const ords=await getOrdenes();
      ords[STATE.selectedId]={...oc,_savedAt:nowStr()};
      await saveOrdenes(ords);
      STATE.ordenes=ords;
      setState({ordenes:ords});
      showToast('✓ Orden de compra guardada en la nube','ok');
    }catch(e){ showToast('Error guardando: '+e.message,'err'); }
    hideLoading();
  });

  // Download OC Excel
  document.getElementById('download-oc')?.addEventListener('click',()=>{
    const oc=readOCFromDOM();
    STATE.oc=oc;
    generatePDF(oc, STATE.solicitudes.find(r=>r.id===STATE.selectedId));
  });
}

// EXCEL GENERATOR
// ══════════════════════════════════════════════════════════════════════════════
function generateExcel(oc, solicitud){
  if(typeof XLSX==='undefined'){ showToast('Librería Excel no cargada, intente de nuevo','err'); return; }
  const wb=XLSX.utils.book_new();
  const ws={};
  const sc=(addr,v)=>{ ws[addr]={v,t:typeof v==='number'?'n':'s'}; };

  sc('H1','GESTION TIC'); sc('AI1','CÓDIGO'); sc('AM1','GTI-FO-023');
  sc('AI2','FECHA'); sc('AM2',new Date().toLocaleDateString('es-CO'));
  sc('H3','ORDEN DE COMPRAS Y SERVICIOS (TIC)');
  sc('AI3','VERSIÓN'); sc('AM3',2);
  sc('AI4','PAGINA'); sc('AM4','1 DE 1');

  sc('B6','Numero de orden'); sc('L6',oc.numeroOrden);
  sc('Z6','Fecha');           sc('AH6',oc.fecha);
  sc('B7','Nombre del Proveedor'); sc('L7',oc.proveedor);
  sc('Z7','Forma de pago');   sc('AH7',oc.formaPago);
  sc('B8','NIT/ C.C');        sc('L8',oc.nit);
  sc('Z8','Nº Cotización');   sc('AH8',oc.cotizacion);
  sc('B9','Dirección');       sc('L9',oc.direccion);
  sc('Z9','Teléfono');        sc('AH9',oc.telefono);

  sc('A11','Item'); sc('D11','Descripción'); sc('Q11','Cantidad');
  sc('T11','Valor Unitario'); sc('Y11','Vr. Total Sin IVA');
  sc('AD11','% IVA'); sc('AG11','Vr. Total IVA'); sc('AL11','Total');

  oc.items.forEach((it,i)=>{
    const row=12+i;
    const q=parseFloat(it.cantidad)||0,vu=parseFloat(it.valorUnitario)||0,iv=(parseFloat(it.iva)||19)/100;
    const sinIva=q*vu,totIva=sinIva*iv,tot=sinIva+totIva;
    ws['A'+row]={v:i+1,t:'n'};
    ws['D'+row]={v:it.descripcion||'',t:'s'};
    ws['Q'+row]={v:q,t:'n'};
    ws['T'+row]={v:vu,t:'n',z:'#,##0'};
    ws['Y'+row]={v:sinIva,t:'n',z:'#,##0'};
    ws['AD'+row]={v:iv,t:'n',z:'0%'};
    ws['AG'+row]={v:totIva,t:'n',z:'#,##0'};
    ws['AL'+row]={v:tot,t:'n',z:'#,##0'};
  });

  const sub=oc.items.reduce((s,it)=>(parseFloat(it.cantidad)||0)*(parseFloat(it.valorUnitario)||0)+s,0);
  const tIva=oc.items.reduce((s,it)=>{const q=parseFloat(it.cantidad)||0,vv=parseFloat(it.valorUnitario)||0,iv=(parseFloat(it.iva)||19)/100;return s+q*vv*iv;},0);
  const desc=parseFloat(oc.descuento)||0, total=sub+tIva-desc;

  sc('AG60','Subtotal'); ws['AL60']={v:sub,t:'n',z:'#,##0'};
  sc('AG61','IVA');      ws['AL61']={v:tIva,t:'n',z:'#,##0'};
  sc('AG62','Descuento');ws['AL62']={v:desc,t:'n',z:'#,##0'};
  sc('AG63','Total');    ws['AL63']={v:total,t:'n',z:'#,##0'};
  sc('A60','Observaciones'); sc('A61',oc.observaciones||'');
  sc('C69','Elaboró: '+(oc.elaboradoPor||'')); sc('C70','Cargo: '+(oc.cargoElabora||''));
  sc('P69','Revisó: Carlos Andrés Peña Molina'); sc('P70','Cargo: Director TIC');
  sc('AD69','VoBo:'); sc('AD70','Cargo: Gerente');

  ws['!ref']='A1:AP74';
  ws['!cols']=Array.from({length:42},(_,i)=>({wch:i<3?8:i<15?12:8}));

  XLSX.utils.book_append_sheet(wb,ws,'GTI-FO-023');
  const fname=`OC_${oc.numeroOrden||solicitud?.id||'orden'}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.xlsx`;
  XLSX.writeFile(wb,fname);
  showToast('✓ Excel descargado: '+fname,'ok');
}

async function boot(){

  try{
    await initBins();
    hideLoading();
    if(STATE.mode==='admin' && STATE.adminAuth){
      await loadAdminData();

      render();
    }
  }catch(e){

    // Still render the app, just without cloud data
    render();
    showToast('⚠ Sin conexión a la nube: '+e.message, 'err');
  }
}


function updateOCTotals(){
  const oc = readOCFromDOM();
  STATE.oc = oc;
  const items = oc.items||[];
  let subtotal=0, totalIva=0;
  items.forEach(it=>{
    const q=parseFloat(it.cantidad||0), vu=parseFloat(it.valorUnitario||0), iv=(parseFloat(it.iva||19))/100;
    subtotal += q*vu;
    totalIva += q*vu*iv;
  });
  const desc = parseFloat(oc.descuento||0);
  const total = subtotal+totalIva-desc;

  function fmtCOP(v){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0}).format(v||0); }

  // Update computed cells (read-only display cells)
  oc.items.forEach((it,i)=>{
    const q=parseFloat(it.cantidad||0), vu=parseFloat(it.valorUnitario||0), iv=(parseFloat(it.iva||19))/100;
    const sin=q*vu, tiva=sin*iv, tot=sin+tiva;
    const sinEl=document.getElementById('oc_calc_sin_'+i);
    const tivaEl=document.getElementById('oc_calc_tiva_'+i);
    const totEl=document.getElementById('oc_calc_tot_'+i);
    if(sinEl) sinEl.textContent = sin>0?fmtCOP(sin):'—';
    if(tivaEl) tivaEl.textContent = tiva>0?fmtCOP(tiva):'—';
    if(totEl) totEl.textContent = tot>0?fmtCOP(tot):'—';
  });

  // Update summary totals
  const subEl=document.getElementById('oc_total_subtotal');
  const ivaEl=document.getElementById('oc_total_iva');
  const totEl=document.getElementById('oc_total_total');
  if(subEl) subEl.textContent=fmtCOP(subtotal);
  if(ivaEl) ivaEl.textContent=fmtCOP(totalIva);
  if(totEl) totEl.textContent=fmtCOP(total);
}

function generatePDF(oc, solicitud) {
  if(typeof window.jspdf === 'undefined' && typeof jsPDF === 'undefined') {
    showToast('Librería PDF no cargada, reintente en unos segundos','err'); return;
  }
  const { jsPDF } = window.jspdf || window;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

  const W = 210, H = 297;
  const ML = 8, MR = 8, MT = 6, MB = 6;
  const CW = W - ML - MR;

  // Colors
  const RED  = [192, 0, 0];
  const WHITE= [255,255,255];
  const BLACK= [0,0,0];
  const GRAY = [242,242,242];

  function fmtC(v) {
    try { return '$ ' + parseFloat(v||0).toLocaleString('es-CO', {minimumFractionDigits:0,maximumFractionDigits:0}); }
    catch { return '$ -'; }
  }

  function filledRect(x,y,w,h,fill) {
    doc.setFillColor(...fill); doc.setDrawColor(...BLACK); doc.setLineWidth(0.3);
    doc.rect(x,y,w,h,'FD');
  }
  function emptyRect(x,y,w,h) {
    doc.setFillColor(...WHITE); doc.setDrawColor(...BLACK); doc.setLineWidth(0.3);
    doc.rect(x,y,w,h,'FD');
  }
  function txt(x,y,s,size,bold,color,align) {
    doc.setFontSize(size||8);
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.setTextColor(...(color||BLACK));
    doc.text(String(s||''), x, y, {align: align||'left'});
  }

  let Y = MT;

  // ── HEADER ──────────────────────────────────────────────
  const HEADER_H = 22;
  const logo_w = 30, info_w = 42;
  const center_w = CW - logo_w - info_w;
  const HY = Y;

  // Outer border
  doc.setDrawColor(...BLACK); doc.setLineWidth(0.4);
  doc.rect(ML, HY, CW, HEADER_H);

  // Logo
  try { doc.addImage(LOGO_B64,'JPEG', ML+0.5, HY+0.5, logo_w-2, HEADER_H-1, undefined,'FAST'); }
  catch(e) { console.warn('Logo error',e); }

  // Separator logo | center
  doc.setDrawColor(...BLACK); doc.setLineWidth(0.3);
  doc.line(ML+logo_w, HY, ML+logo_w, HY+HEADER_H);

  // Center: GESTION TIC
  const top_h = HEADER_H * 0.40;
  txt(ML+logo_w+center_w/2, HY+top_h/2+1, 'GESTION TIC', 11, true, BLACK, 'center');
  doc.line(ML+logo_w, HY+top_h, ML+logo_w+center_w, HY+top_h);

  // Center: ORDEN DE COMPRAS
  const bot_h = HEADER_H - top_h;
  txt(ML+logo_w+center_w/2, HY+top_h+bot_h/2+1, 'ORDEN DE COMPRAS Y SERVICIOS (TIC)', 9, true, BLACK, 'center');

  // Separator center | info
  const ix = ML+logo_w+center_w;
  doc.line(ix, HY, ix, HY+HEADER_H);

  // Info rows
  const row_h = HEADER_H / 4;
  const infoRows = [['CÓDIGO','GTI-FO-023'],['FECHA', oc.fecha||''],['VERSIÓN','2'],['PAGINA','1 DE 1']];
  infoRows.forEach(([lbl,val],i) => {
    const ry = HY + i*row_h;
    if(i>0) doc.line(ix, ry, ix+info_w, ry);
    const mid = ix + info_w*0.48;
    doc.line(mid, ry, mid, ry+row_h);
    txt(ix+1, ry+row_h/2+1, lbl, 7, true, BLACK);
    txt(mid+1, ry+row_h/2+1, val, 7, false, BLACK);
  });

  Y = HY + HEADER_H + 1;

  // ── FIELD ROWS ───────────────────────────────────────────
  const FH = 7;
  const lw1=CW*0.22, vw1=CW*0.28, lw2=CW*0.22, vw2=CW-lw1-vw1-lw2;
  const fieldData = [
    ['Numero de orden', oc.numeroOrden||'',    'Fecha',        oc.fecha||''],
    ['Nombre del Proveedor', oc.proveedor||'-','Forma de pago',oc.formaPago||'-'],
    ['NIT/ C.C',  oc.nit||'-',                 'Nº Cotización',oc.cotizacion||'-'],
    ['Dirección', oc.direccion||'-',            'Teléfono',     oc.telefono||'-'],
  ];
  fieldData.forEach(([l1,v1,l2,v2]) => {
    let x = ML;
    filledRect(x,Y,lw1,FH,RED); txt(x+1.2,Y+FH/2+0.8,l1,7,true,WHITE); x+=lw1;
    emptyRect(x,Y,vw1,FH);      txt(x+1.2,Y+FH/2+0.8,v1,7,false,BLACK); x+=vw1;
    filledRect(x,Y,lw2,FH,RED); txt(x+1.2,Y+FH/2+0.8,l2,7,true,WHITE); x+=lw2;
    emptyRect(x,Y,vw2,FH);      txt(x+1.2,Y+FH/2+0.8,v2,7,false,BLACK);
    Y += FH;
  });
  Y += 0.7;

  // ── ITEMS TABLE ──────────────────────────────────────────
  // Portrait CW=194mm — columns proportional
  const C = [7, 0, 14, 22, 22, 10, 22, 22];
  C[1] = CW - C[0] - C[2] - C[3] - C[4] - C[5] - C[6] - C[7];
  const HDRS  = ['Item','Descripción','Cantidad','Valor Unitario','Vr. Total Sin IVA','% IVA','Vr. Total IVA','Total'];
  const ALIGN = ['center','left','center','right','right','center','right','right'];

  const HDR_H = 7;
  let x = ML;
  HDRS.forEach((h,j) => {
    filledRect(x,Y,C[j],HDR_H,RED);
    const px = ALIGN[j]==='center'?x+C[j]/2:(ALIGN[j]==='right'?x+C[j]-1.5:x+1.5);
    txt(px, Y+HDR_H/2+2, h, 7, true, WHITE, ALIGN[j]);
    x += C[j];
  });
  Y += HDR_H;

  const items = oc.items||[];
  const n_rows = Math.max(items.length, 7);
  const IH = 6;
  let subtotal=0, totalIvaSum=0;

  for(let i=0; i<n_rows; i++) {
    const bg = i%2===1 ? GRAY : WHITE;
    let row;
    if(i < items.length) {
      const it = items[i];
      const qty = parseFloat(it.cantidad||0);
      const vu  = parseFloat(it.valorUnitario||0);
      const iva = parseFloat(it.iva||19)/100;
      const sin = qty*vu, tiva=sin*iva, tot=sin+tiva;
      subtotal+=sin; totalIvaSum+=tiva;
      row = [String(i+1), String(it.descripcion||'-'),
             qty?qty.toLocaleString('es-CO'):'',
             vu?vu.toLocaleString('es-CO'):'',
             fmtC(sin), (it.iva||19)+'%', fmtC(tiva), fmtC(tot)];
    } else {
      row = ['','','','','0.00','19%','$ -','$ -'];
    }
    let x2=ML;
    row.forEach((val,j) => {
      doc.setFillColor(...bg); doc.setDrawColor(...BLACK); doc.setLineWidth(0.18);
      doc.rect(x2,Y,C[j],IH,'FD');
      const px = ALIGN[j]==='center'?x2+C[j]/2:(ALIGN[j]==='right'?x2+C[j]-1.5:x2+1.5);
      txt(px, Y+IH/2+2, val, 7, false, BLACK, ALIGN[j]);
      x2+=C[j];
    });
    Y+=IH;
  }

  // ── OBSERVACIONES + TOTALES ──────────────────────────────
  const OBS_H = 16;
  const tot_w = C[5]+C[6]+C[7];
  const obs_w = CW - tot_w;
  const desc  = parseFloat(oc.descuento||0);
  const totalF= subtotal+totalIvaSum-desc;

  const obs_lbl_w=obs_w*0.33, obs_val_w=obs_w-obs_lbl_w;
  filledRect(ML,Y,obs_lbl_w,OBS_H,RED);
  txt(ML+2, Y+OBS_H/2+2, 'Observaciones', 8, true, WHITE);
  emptyRect(ML+obs_lbl_w, Y, obs_val_w, OBS_H);
  txt(ML+obs_lbl_w+2, Y+OBS_H/2+2, String(oc.observaciones||'-').substring(0,60), 8);

  const tot_x=ML+obs_w, tot_row_h=OBS_H/4;
  const tot_lbl_w=tot_w*0.46, tot_val_w=tot_w-tot_lbl_w;
  const totRows=[['Subtotal',fmtC(subtotal)],['IVA',fmtC(totalIvaSum)],
                 ['Descuento',desc?fmtC(desc):''],['Total',fmtC(totalF)]];
  totRows.forEach(([lbl,val],i) => {
    const ry=Y+i*tot_row_h;
    filledRect(tot_x,ry,tot_lbl_w,tot_row_h,RED);
    txt(tot_x+tot_lbl_w-2, ry+tot_row_h/2+2, lbl, 8, true, WHITE, 'right');
    emptyRect(tot_x+tot_lbl_w,ry,tot_val_w,tot_row_h);
    txt(tot_x+tot_lbl_w+tot_val_w-2, ry+tot_row_h/2+2, val, 8, false, BLACK, 'right');
  });

  Y += OBS_H + 1;

  // ── FIRMAS ────────────────────────────────────────────────
  const SIG_H = 20;
  const sig_w = CW/3;
  const SIG_Y = H - MB - SIG_H;
  doc.setDrawColor(...BLACK); doc.setLineWidth(0.3);
  doc.rect(ML, SIG_Y, CW, SIG_H);

  const sigs = [
    [`Elaboró: ${oc.elaboradoPor||''}`, `Cargo: ${oc.cargoElabora||''}`],
    ['Revisó: Carlos Andrés Peña Molina','Cargo: Director TIC'],
    ['VoBo:','Cargo: Gerente'],
  ];
  sigs.forEach(([l1,l2],i) => {
    const sx = ML + i*sig_w;
    if(i>0) doc.line(sx, SIG_Y, sx, SIG_Y+SIG_H);
    const line_y = SIG_Y + SIG_H*0.60;
    doc.setDrawColor(...BLACK); doc.setLineWidth(0.2);
    doc.line(sx+4, line_y, sx+sig_w-4, line_y);
    txt(sx+sig_w/2, line_y+4, l1, 8, false, BLACK, 'center');
    txt(sx+sig_w/2, line_y+9, l2, 8, false, BLACK, 'center');
  });

  const fname = `OC_${oc.numeroOrden||solicitud?.id||'orden'}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.pdf`;
  doc.save(fname);
  showToast('✓ PDF descargado: '+fname,'ok');
}

// Auto-refresh for admin every 30 seconds
setInterval(()=>{
  if(STATE.mode==='admin' && STATE.adminAuth){
    CACHE_SOL=null; CACHE_OC=null;
    getSolicitudes().then(sols=>{ STATE.solicitudes=sols; render(); }).catch(()=>{});
  }
},30000);

boot();
</script>
</body>
</html>
