function generatePDF(oc, solicitud) {
  if(typeof window.jspdf === 'undefined' && typeof jsPDF === 'undefined') {
    showToast('Librería PDF no cargada, reintente','err'); return;
  }
  const { jsPDF } = window.jspdf || window;
  const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });

  // A4 portrait in points: 595 x 842
  const PW = 595.28, PH = 841.89;
  const ML = 40, MR = 40, MT = 34, MB = 34;
  const CW = PW - ML - MR;

  const RED   = [192,0,0];
  const WHITE = [255,255,255];
  const BLACK = [0,0,0];
  const GRAY  = [242,242,242];

  function fmtC(v) {
    try { return '$ ' + parseFloat(v||0).toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:0}); }
    catch { return '$ 0'; }
  }

  function fr(x,y,w,h,fill) {
    doc.setFillColor(...fill); doc.setDrawColor(...BLACK);
    doc.setLineWidth(0.6); doc.rect(x,y,w,h,'FD');
  }
  function er(x,y,w,h) {
    doc.setFillColor(...WHITE); doc.setDrawColor(...BLACK);
    doc.setLineWidth(0.6); doc.rect(x,y,w,h,'FD');
  }
  function cell(x,y,w,h,s,sz,bold,col,align) {
    // Vertically centered text inside a cell
    doc.setFontSize(sz||8);
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.setTextColor(...(col||BLACK));
    const ty = y + h/2 + (sz||8)*0.35;
    const pad = 4;
    if(align==='center') doc.text(String(s||''), x+w/2, ty, {align:'center'});
    else if(align==='right') doc.text(String(s||''), x+w-pad, ty, {align:'right'});
    else doc.text(String(s||''), x+pad, ty, {align:'left'});
  }

  let Y = MT;

  // ── HEADER ────────────────────────────────────────────────────
  const HH=91, lw=102, iw=148, cw2=CW-lw-iw, HY=Y;

  doc.setDrawColor(...BLACK); doc.setLineWidth(1.0);
  doc.rect(ML,HY,CW,HH);

  // Dynamic logo based on empresa
  const _solicEmp2=(solicitud&&solicitud.requester&&solicitud.requester.company)||'';
  const _empRec2=loadEmpresas().find(function(e){return e.nombre===_solicEmp2;});
  const _useLogo2=(_empRec2&&_empRec2.logo)?_empRec2.logo:LOGO_REQ_B64;
  try { doc.addImage(_useLogo2,'JPEG',ML+2,Y+2,lw-6,HH-4,undefined,'FAST');
  } catch(e) {
    try { doc.addImage(LOGO_REQ_B64,'JPEG',ML+2,Y+2,lw-6,HH-4,undefined,'FAST'); } catch(e2) {}
  }

  // Logo | center separator
  doc.setDrawColor(...BLACK); doc.setLineWidth(0.6);
  doc.line(ML+lw,HY,ML+lw,HY+HH);

  // GESTION TIC
  const th=HH*0.42;
  doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(...BLACK);
  const _empNom=(_empRec&&_empRec.nombre)?_empRec.nombre:'GESTION TIC';
  doc.text(_empNom, ML+lw+cw2/2, HY+th/2+5, {align:'center'});
  doc.line(ML+lw,HY+th,ML+lw+cw2,HY+th);

  // ORDEN DE COMPRAS
  doc.setFontSize(9);
  doc.text('ORDEN DE COMPRAS Y SERVICIOS (TIC)', ML+lw+cw2/2, HY+th+(HH-th)/2+4, {align:'center'});

  // center | info separator
  const ix=ML+lw+cw2;
  doc.line(ix,HY,ix,HY+HH);

  // Info rows
  const rh=HH/4;
  const infoRows=[['CÓDIGO','GTI-FO-023'],['FECHA',oc.fecha||''],['VERSIÓN','2'],['PAGINA','1 DE 1']];
  infoRows.forEach(([lbl,val],i) => {
    const ry=HY+i*rh;
    if(i>0) doc.line(ix,ry,ix+iw,ry);
    const mid=ix+iw*0.46;
    doc.line(mid,ry,mid,ry+rh);
    cell(ix,ry,mid-ix,rh,lbl,7,true,BLACK,'left');
    cell(mid,ry,ix+iw-mid,rh,val,7,false,BLACK,'left');
  });

  Y = HY + HH + 5;

  // ── FIELD ROWS ─────────────────────────────────────────────────
  const FH=19;
  const fw1=CW*0.215, fw2=CW*0.285, fw3=CW*0.215, fw4=CW-fw1-fw2-fw3;
  const fieldData=[
    ['Numero de orden',oc.numeroOrden||'',    'Fecha',        oc.fecha||''],
    ['Nombre del Proveedor',oc.proveedor||'-','Forma de pago',oc.formaPago||'-'],
    ['NIT/ C.C',oc.nit||'-',                  'Nº Cotización',oc.cotizacion||'-'],
    ['Dirección',oc.direccion||'-',            'Teléfono',     oc.telefono||'-'],
  ];
  fieldData.forEach(([l1,v1,l2,v2]) => {
    let x=ML;
    fr(x,Y,fw1,FH,RED);  cell(x,Y,fw1,FH,l1,7.5,true,WHITE,'left');  x+=fw1;
    er(x,Y,fw2,FH);       cell(x,Y,fw2,FH,v1,7.5,false,BLACK,'left'); x+=fw2;
    fr(x,Y,fw3,FH,RED);  cell(x,Y,fw3,FH,l2,7.5,true,WHITE,'left');  x+=fw3;
    er(x,Y,fw4,FH);       cell(x,Y,fw4,FH,v2,7.5,false,BLACK,'left');
    Y+=FH;
  });
  Y+=5;

  // ── ITEMS TABLE ────────────────────────────────────────────────
  const C=[24,0,44,61,61,31,57,57];
  C[1]=CW-C[0]-C[2]-C[3]-C[4]-C[5]-C[6]-C[7];
  const HDRS=[['Item'],['Descripción'],['Cantidad'],['Valor','Unitario'],['Vr. Total','Sin IVA'],['%','IVA'],['Vr. Total','IVA'],['Total']];
  const ALN=['center','left','center','right','right','center','right','right'];

  const HDH=22;
  let x=ML;
  HDRS.forEach((lines,j) => {
    fr(x,Y,C[j],HDH,RED);
    if(lines.length===2) {
      const px=ALN[j]==='center'?x+C[j]/2:(ALN[j]==='right'?x+C[j]-4:x+4);
      doc.setFontSize(6); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
      doc.text(lines[0], px, Y+HDH/2-1, {align:ALN[j]});
      doc.text(lines[1], px, Y+HDH/2+6, {align:ALN[j]});
    } else {
      cell(x,Y,C[j],HDH,lines[0],6.5,true,WHITE,ALN[j]);
    }
    x+=C[j];
  });
  Y+=HDH;

  const items=oc.items||[];
  const nRows=Math.max(items.length,7);
  const IH=16;
  let sub=0, tivaSum=0;

  for(let i=0;i<nRows;i++){
    const bg=i%2===1?GRAY:WHITE;
    let row;
    if(i<items.length){
      const it=items[i];
      const qty=parseFloat(it.cantidad||0), vu=parseFloat(it.valorUnitario||0);
      const iva=parseFloat(it.iva||19)/100;
      const sin=qty*vu, tiv=sin*iva, tot=sin+tiv;
      sub+=sin; tivaSum+=tiv;
      row=[String(i+1),String(it.descripcion||'-'),
           qty?qty.toLocaleString('es-CO'):'',
           vu?vu.toLocaleString('es-CO'):'',
           fmtC(sin), (it.iva||19)+'%', fmtC(tiv), fmtC(tot)];
    } else {
      row=['','','','','$ 0','19%','$ 0','$ 0'];
    }
    let x2=ML;
    row.forEach((val,j)=>{
      doc.setFillColor(...bg); doc.setDrawColor(...BLACK); doc.setLineWidth(0.4);
      doc.rect(x2,Y,C[j],IH,'FD');
      cell(x2,Y,C[j],IH,val,6.5,false,BLACK,ALN[j]);
      x2+=C[j];
    });
    Y+=IH;
  }

  // ── OBSERVACIONES + TOTALES ────────────────────────────────────
  const OH=46;
  const tw=C[5]+C[6]+C[7], ow=CW-tw;
  const desc=parseFloat(oc.descuento||0);
  const totalF=sub+tivaSum-desc;

  const olw=ow*0.32, ovw=ow-olw;
  fr(ML,Y,olw,OH,RED);
  cell(ML,Y,olw,OH,'Observaciones',7.5,true,WHITE,'left');
  er(ML+olw,Y,ovw,OH);
  // obs text with wrapping
  const obsText=String(oc.observaciones||'-');
  doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(...BLACK);
  const obsLines=doc.splitTextToSize(obsText, ovw-8);
  doc.text(obsLines.slice(0,3), ML+olw+4, Y+OH/2-3);

  const tx=ML+ow, trh=OH/4, tlw=tw*0.48, tvw=tw-tlw;
  [['Subtotal',fmtC(sub)],['IVA',fmtC(tivaSum)],
   ['Descuento',desc?fmtC(desc):''],['Total',fmtC(totalF)]
  ].forEach(([lbl,val],i)=>{
    const ry=Y+i*trh;
    fr(tx,ry,tlw,trh,RED); cell(tx,ry,tlw,trh,lbl,7,true,WHITE,'right');
    er(tx+tlw,ry,tvw,trh); cell(tx+tlw,ry,tvw,trh,val,7,false,BLACK,'right');
  });
  Y+=OH;

  // ── FIRMAS — justo debajo de observaciones ─────────────────────
  Y+=11;
  const SH=62, sw=CW/3;
  doc.setDrawColor(...BLACK); doc.setLineWidth(0.6);
  doc.rect(ML,Y,CW,SH);

  const sigs=[
    [('Elaboró: '+(oc.elaboradoPor||'')), ('Cargo: '+(oc.cargoElabora||''))],
    ['Revisó: Carlos Andrés Peña Molina','Cargo: Director TIC'],
    ['VoBo:','Cargo: Gerente'],
  ];
  sigs.forEach(([l1,l2],i)=>{
    const sx=ML+i*sw;
    if(i>0){ doc.setDrawColor(...BLACK); doc.line(sx,Y,sx,Y+SH); }
    const ly=Y+SH*0.60;
    doc.setDrawColor(...BLACK); doc.setLineWidth(0.4);
    doc.line(sx+10,ly,sx+sw-10,ly);
    doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...BLACK);
    doc.text(l1, sx+sw/2, ly+11, {align:'center'});
    doc.text(l2, sx+sw/2, ly+20, {align:'center'});
  });

  const fname=`OC_${oc.numeroOrden||solicitud?.id||'orden'}_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.pdf`;
  doc.save(fname);
  showToast('✓ PDF descargado: '+fname,'ok');
}

// Auto-refresh disabled

boot();
</script>
